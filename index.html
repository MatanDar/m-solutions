<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-SOLUTIONS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* --- סגנונות כלליים למצב כהה --- */
        body {
            background-color: #0a0a0a;
            color: #ffffff;
        }
        
        /* --- הסרת הרקע הגדול --- */

        /* --- סגנונות Navbar חדש --- */
        .top-navbar {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            padding: 15px 0;
            border-bottom: 2px solid #5d64f2;
            box-shadow: 0 4px 6px rgba(93, 100, 242, 0.3);
        }
        .navbar-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            flex-direction: row-reverse; /* הופך את הסדר */
        }
        .logo-section {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-direction: row-reverse; /* הופך את הסדר - תמונה שמאלה, טקסט ימינה */
        }
        .navbar-brand-logo {
            height: 45px;
        }
        .brand-text {
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(45deg, #5d64f2, #764def);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
        }
        .search-section {
            flex-grow: 1;
            max-width: 500px;
            margin-left: 30px; /* שינוי מימין לשמאל */
        }
        .search-input {
            width: 100%;
            padding: 10px 15px;
            border-radius: 25px;
            border: 1px solid #5d64f2;
            background-color: #1a1a2e;
            color: #ffffff;
            font-size: 0.95rem;
        }
        .search-input:focus {
            outline: none;
            border-color: #764def;
            background-color: #16213e;
            box-shadow: 0 0 10px rgba(118, 77, 239, 0.3);
        }
        .search-input::placeholder {
            color: #888;
        }

        /* --- סגנונות פילטרים --- */
        .filters-section {
            background: linear-gradient(135deg, #16213e 0%, #1a1a2e 100%);
            padding: 25px;
            margin: 30px 0;
            border-radius: 12px;
            border: 1px solid #5d64f2;
            box-shadow: 0 4px 15px rgba(93, 100, 242, 0.2);
        }
        .filter-row {
            display: flex;
            gap: 30px;
            align-items: flex-start;
            flex-wrap: wrap;
        }
        .filter-group {
            flex: 1;
            min-width: 200px;
        }
        .filter-label {
            display: block;
            margin-bottom: 12px;
            color: #764def;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .sort-select {
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #5d64f2;
            background-color: #1a1a2e;
            color: #ffffff;
            font-size: 0.95rem;
            cursor: pointer;
        }
        .sort-select:focus {
            outline: none;
            border-color: #764def;
            box-shadow: 0 0 8px rgba(118, 77, 239, 0.3);
        }
        .reset-btn {
            padding: 8px 20px;
            background-color: #1a1a2e;
            border: 1px solid #5d64f2;
            color: #764def;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
        }
        .reset-btn:hover {
            background-color: #16213e;
            color: #fff;
            border-color: #764def;
        }

        /* --- סגנונות כרטיס מוצר --- */
        .product-card {
            border: 1px solid #5d64f2;
            background: linear-gradient(135deg, #16213e 0%, #1a1a2e 100%);
            box-shadow: 0 4px 8px rgba(93, 100, 242, 0.2);
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 20px;
            height: 100%;
            display: flex;
            flex-direction: column;
            text-align: right;
            border-radius: 10px; 
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(118, 77, 239, 0.4);
            border-color: #764def;
        }
        .card-title {
            color: #f8f9fa;
            font-size: 1.25rem;
            font-weight: 600;
            height: 50px;
            overflow: hidden;
        }
        .card-text {
            height: 70px;
            overflow: hidden;
            font-size: 0.9rem;
            color: #aaaaaa;
            line-height: 1.5;
        }
        /* --- סגנונות תמונה (מוצר) --- */
        .product-image {
            height: 220px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8f9fa;
            border-radius: 10px 10px 0 0;
            padding: 15px;
        }
        .product-image a {
            display: block;
            height: 100%;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .product-image img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
        }
        .card-body {
            flex-grow: 1;
            padding: 15px;
        }
        .btn-buy {
            width: 100%;
            font-size: 1.1rem;
            background: linear-gradient(135deg, #5d64f2, #764def);
            border: none;
            transition: all 0.3s;
        }
        .btn-buy:hover {
            background: linear-gradient(135deg, #764def, #5d64f2);
            transform: scale(1.02);
            box-shadow: 0 4px 15px rgba(118, 77, 239, 0.5);
        }

        /* --- רספונסיביות: 4 כרטיסים בשורה ברזולוציות רחבות --- */
        @media (min-width: 768px) {
            .col-md-4 {
                width: 25%;
                margin-top: 20px;
            }
        }

        /* --- רספונסיביות: הקטנת רוחב ומרכוז בסלולר --- */
        @media (max-width: 575.98px) {
            .col-sm-6 {
                width: 85%; 
                margin-left: auto;
                margin-right: auto;
                margin-top: 20px;
            }
            .navbar-container {
                flex-direction: column;
                gap: 15px;
            }
            .search-section {
                margin: 0;
                max-width: 100%;
            }
            .filter-row {
                flex-direction: column;
            }
        }

        /* --- מרווח 20px בין שורות --- */
        #product-list {
            row-gap: 20px;
        }

        /* --- טקסט תוצאות חיפוש --- */
        .results-count {
            color: #764def;
            font-size: 1rem;
            margin: 15px 0;
            text-align: right;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- Navbar חדש -->
    <nav class="top-navbar">
        <div class="navbar-container">
            <div class="logo-section">
                <img src="img/MSolutions.png" alt="M-SOLUTIONS Logo" class="navbar-brand-logo">
                <h1 class="brand-text">M-SOLUTIONS</h1>
            </div>
            <div class="search-section">
                <input type="text" id="searchInput" class="search-input" placeholder="חפש מוצרים...">
            </div>
        </div>
    </nav>
    
    <header class="main-header-bg" style="display: none;"></header> 
    
    <div class="container mt-4">
        <!-- סקשן פילטרים -->
        <div class="filters-section">
            <div class="filter-row">
                <div class="filter-group">
                    <label class="filter-label">מיון לפי:</label>
                    <select id="sortSelect" class="sort-select">
                        <option value="default">ברירת מחדל</option>
                        <option value="name-asc">שם (א-ת)</option>
                        <option value="name-desc">שם (ת-א)</option>
                    </select>
                </div>
                
                <div class="filter-group" style="flex: 0;">
                    <label class="filter-label">&nbsp;</label>
                    <button id="resetBtn" class="reset-btn">אפס פילטרים</button>
                </div>
            </div>
        </div>
        
        <!-- תוצאות חיפוש -->
        <div id="resultsCount" class="results-count"></div>
        
        <div id="product-list" class="row">
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRcIf9Ew8DK7FY7Bpys2hDumQBd0qXrtcNjxYmYuL6yLWrfb0r4l3tX1XcmytUksxl4ZqYZO0LfC3SE/pub?gid=725361923&single=true&output=csv'; 
    
    const HEADERS = [
        "PRODUCT_URL", 
        "TITLE", 
        "DESCRIPTION", 
        "IMAGE_URL", 
        "AFFILIATE_LINK" 
    ];

    let allProducts = [];
    let filteredProducts = [];

    function parseCSV(csvText, headers) {
        const products = [];
        const lines = csvText.trim().split('\n');
        
        for (let i = 1; i < lines.length; i++) {
            const values = lines[i].match(/(?:"[^"]*"|[^,])+/g); 
            
            if (values && values.length >= headers.length) {
                let product = {};
                headers.forEach((header, index) => {
                    let value = values[index] ? values[index].trim() : '';
                    if (value.startsWith('"') && value.endsWith('"')) {
                        value = value.slice(1, -1);
                    }
                    product[header] = value;
                });
                products.push(product);
            }
        }
        return products;
    }

    function applyFilters() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const sortBy = document.getElementById('sortSelect').value;

        // פילטור
        filteredProducts = allProducts.filter(product => {
            const title = (product['TITLE'] || '').toLowerCase();
            const description = (product['DESCRIPTION'] || '').toLowerCase();

            // חיפוש טקסט
            const matchesSearch = !searchTerm || 
                title.includes(searchTerm) || 
                description.includes(searchTerm);

            return matchesSearch;
        });

        // מיון
        if (sortBy === 'name-asc') {
            filteredProducts.sort((a, b) => (a['TITLE'] || '').localeCompare(b['TITLE'] || '', 'he'));
        } else if (sortBy === 'name-desc') {
            filteredProducts.sort((a, b) => (b['TITLE'] || '').localeCompare(a['TITLE'] || '', 'he'));
        }

        displayProducts();
    }

    function displayProducts() {
        const productList = document.getElementById('product-list');
        const resultsCount = document.getElementById('resultsCount');
        productList.innerHTML = '';

        // עדכון מספר התוצאות
        resultsCount.textContent = `${filteredProducts.length} תוצאות נמצאו`;

        if (filteredProducts.length === 0) {
            productList.innerHTML = `<div class="alert alert-info" role="alert" dir="rtl">לא נמצאו מוצרים התואמים לחיפוש.</div>`;
            return;
        }

        filteredProducts.forEach(product => {
            const affiliateLink = product['AFFILIATE_LINK'];
            const regularLink = product['PRODUCT_URL'];
            const finalLink = affiliateLink && affiliateLink.length > 5 ? affiliateLink : regularLink;
            
            const title = product['TITLE'];
            const description = product['DESCRIPTION'];
            let imageUrl = product['IMAGE_URL'];
            
            if (imageUrl) {
                imageUrl = imageUrl.toString().replace('.avif', ''); 
                if (imageUrl.includes('<') || imageUrl.includes('>')) {
                    imageUrl = ''; 
                }
            }

            if (finalLink && title && imageUrl) { 
                const imageOnError = "this.onerror=null; this.src='https://placehold.co/250x250?text=No+Image'";

                const cardHtml = `
                    <div class="col-md-4 col-sm-6">
                        <div class="product-card">
                            <a href="${finalLink}" target="_blank" rel="nofollow noopener noreferrer" style="text-decoration: none; color: inherit;">
                                <div class="product-image">
                                    <img src="${imageUrl}" alt="${title} - תמונה" onerror="${imageOnError}">
                                </div>
                            </a>
                            <div class="card-body">
                                <h5 class="card-title">${title}</h5>
                                <p class="card-text">${description || 'אין תיאור.'}</p>
                                <a href="${finalLink}" target="_blank" rel="nofollow noopener noreferrer" class="btn btn-primary btn-buy">קנה עכשיו בעלי אקספרס</a>
                            </div>
                        </div>
                    </div>
                `;
                productList.innerHTML += cardHtml;
            }
        });
    }

    async function loadProducts() {
        const productList = document.getElementById('product-list');
        
        if (!productList) {
            console.error("Error: Element with ID 'product-list' not found.");
            return;
        }

        productList.innerHTML = 'טוען מוצרים...';

        try {
            const response = await fetch(SHEET_URL);
            const csvText = await response.text();
            
            allProducts = parseCSV(csvText, HEADERS);
            filteredProducts = [...allProducts];
            
            displayProducts();
            
        } catch (error) {
            productList.innerHTML = `<div class="alert alert-danger" role="alert" dir="rtl">
                                        שגיאה בטעינת הנתונים מה-CSV. ודא שהקישור נכון.
                                        <br>פרטי שגיאה: ${error.message}
                                    </div>`;
            console.error('Error loading products:', error);
        }
    }

    // אפס פילטרים
    function resetFilters() {
        document.getElementById('searchInput').value = '';
        document.getElementById('sortSelect').value = 'default';
        applyFilters();
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadProducts();

        // מאזינים לפילטרים
        document.getElementById('searchInput').addEventListener('input', applyFilters);
        document.getElementById('sortSelect').addEventListener('change', applyFilters);
        document.getElementById('resetBtn').addEventListener('click', resetFilters);
    });
</script>
</body>
</html>
