<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-SOLUTIONS | מוצרים מומלצים</title>
    
    <link rel="icon" type="image/png" href="img/logo.png">
    <link rel="apple-touch-icon" href="img/logo.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(99, 102, 241, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* Header */
        header {
            text-align: center;
            padding: 40px 20px;
            animation: fadeInDown 0.8s ease-out;
        }

        .logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 20px;
            background: white;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 1rem;
            color: #4a5568;
            font-weight: 400;
            margin-bottom: 30px;
        }

        /* Back Button */
        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: white;
            border: none;
            border-radius: 25px;
            color: #4a5568;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 30px;
            font-family: 'DM Sans', sans-serif;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .back-btn:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.3);
        }

        /* Search Bar */
        .search-container {
            margin-bottom: 30px;
            animation: fadeIn 1s ease-out 0.2s both;
        }

        .search-input {
            width: 100%;
            padding: 16px 20px;
            border: none;
            border-radius: 25px;
            background: white;
            font-size: 1rem;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
            text-align: center;
        }

        .search-input:focus {
            outline: none;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.2);
        }

        .search-input::placeholder {
            color: #a0aec0;
        }

        /* ========== CATEGORIES - LINKTREE STYLE ========== */
        .categories-grid {
            display: flex;
            flex-direction: column;
            gap: 30px;
            margin-bottom: 40px;
        }

        .category-card {
            background: white;
            border-radius: 20px;
            padding: 25px 25px 20px 25px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            animation: fadeInUp 0.6s ease-out both;
            overflow: hidden;
        }

        .category-card:nth-child(1) { animation-delay: 0.1s; }
        .category-card:nth-child(2) { animation-delay: 0.15s; }
        .category-card:nth-child(3) { animation-delay: 0.2s; }
        .category-card:nth-child(4) { animation-delay: 0.25s; }
        .category-card:nth-child(5) { animation-delay: 0.3s; }
        .category-card:nth-child(6) { animation-delay: 0.35s; }
        .category-card:nth-child(7) { animation-delay: 0.4s; }
        .category-card:nth-child(8) { animation-delay: 0.45s; }

        .category-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
        }

        /* Category Images Grid - 1 large + 4 small */
        .category-images {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 10px;
            height: 160px;
            margin-bottom: 20px;
        }

        .category-images img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
            background: #f5f5f5;
        }

        .category-image-large {
            grid-row: 1 / 3;
            grid-column: 1;
        }

        .category-info {
            text-align: center;
            padding: 15px 20px;
            background: white;
            border-radius: 12px;
            margin-top: 5px;
        }

        .category-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 8px;
        }

        .category-count {
            font-size: 0.9rem;
            color: #999;
        }

        /* ========== PRODUCTS - 3 PER ROW ========== */
        .products-list {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .product-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            text-decoration: none;
            color: inherit;
            display: block;
            animation: fadeInUp 0.6s ease-out both;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .product-image-container {
            width: 100%;
            height: 250px;
            overflow: hidden;
            background: #f5f5f5;
            position: relative;
        }

        .product-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .product-card:hover .product-image-container img {
            transform: scale(1.05);
        }

        .product-info {
            padding: 15px;
            text-align: center;
        }

        .product-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #1a202c;
            margin-bottom: 8px;
            line-height: 1.4;
            height: 42px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .product-description {
            font-size: 0.85rem;
            color: #718096;
            line-height: 1.3;
            height: 36px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .product-arrow {
            display: none;
        }

        /* Load More Button */
        .load-more-container {
            text-align: center;
            margin-top: 30px;
        }

        .load-more-btn {
            padding: 16px 32px;
            background: white;
            border: none;
            border-radius: 25px;
            color: #1a202c;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'DM Sans', sans-serif;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .load-more-btn:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.3);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 40px 20px;
            color: #718096;
            font-size: 0.9rem;
            animation: fadeIn 1.5s ease-out;
        }

        /* Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #718096;
            font-size: 1.1rem;
        }

        .hidden {
            display: none !important;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                max-width: 100%;
            }

            .categories-grid {
                gap: 20px;
            }

            .category-card {
                padding: 20px;
            }

            .category-info {
                padding: 12px 15px;
            }

            .category-images {
                height: 130px;
                gap: 8px;
                margin-bottom: 15px;
            }

            .products-list {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }

            .product-image-container {
                height: 180px;
            }

            h1 {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .categories-grid {
                gap: 15px;
            }

            .category-card {
                padding: 15px;
            }

            .category-info {
                padding: 10px 12px;
            }

            .category-images {
                height: 110px;
                gap: 6px;
                margin-bottom: 12px;
            }

            .products-list {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .product-image-container {
                height: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <div class="logo">
                <img src="img/logo.png" alt="M-SOLUTIONS Logo" onerror="this.style.display='none'">
            </div>
            <h1>M-SOLUTIONS</h1>
            <p class="subtitle">בחר קטגוריה לצפייה במוצרים 🛍️</p>
        </header>

        <!-- Categories View -->
        <div id="categoriesView">
            <div class="search-container">
                <input type="text" id="categorySearch" class="search-input" placeholder="🔍 חפש קטגוריה...">
            </div>
            <div class="categories-grid" id="categoriesList">
                <div class="loading">טוען קטגוריות...</div>
            </div>
        </div>

        <!-- Products View -->
        <div id="productsView" class="hidden">
            <button class="back-btn" onclick="showCategories()">
                ← חזרה לקטגוריות
            </button>

            <div class="search-container">
                <input type="text" id="searchInput" class="search-input" placeholder="🔍 חפש מוצר...">
            </div>

            <div class="products-list" id="product-list">
                <div class="loading">טוען מוצרים...</div>
            </div>

            <div class="load-more-container">
                <button class="load-more-btn hidden" id="loadMoreBtn" onclick="loadMoreProducts()">
                    טען עוד מוצרים
                </button>
            </div>
        </div>

        <!-- Footer -->
        <footer>
            <p>© 2026 M-SOLUTIONS | מוצרים מומלצים מ-AliExpress</p>
        </footer>
    </div>

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRcIf9Ew8DK7FY7Bpys2hDumQBd0qXrtcNjxYmYuL6yLWrfb0r4l3tX1XcmytUksxl4ZqYZO0LfC3SE/pub?gid=725361923&single=true&output=csv';
        
        const HEADERS = [
            "PRODUCT_URL", 
            "TITLE", 
            "DESCRIPTION", 
            "IMAGE_URL", 
            "AFFILIATE_LINK",
            "KEYWORDS",
            "CATEGORY"
        ];

        const CATEGORIES = [
            { name: 'מוצרי חשמל', icon: '🔌' },
            { name: 'מטבח ובית', icon: '🍳' },
            { name: 'ספורט וכושר', icon: '⚽' },
            { name: 'תיקים ואביזרים', icon: '👜' },
            { name: 'כלי עבודה', icon: '🔧' },
            { name: 'צעצועים', icon: '🎮' },
            { name: 'אופנה', icon: '👔' },
            { name: 'מוצרים לטלפון', icon: '📱' }
        ];

        let allProducts = [];
        let filteredProducts = [];
        let displayedCount = 0;
        let currentCategory = '';
        const PRODUCTS_PER_LOAD = 12;

        function parseCSV(csvText, headers) {
            const products = [];
            const lines = csvText.trim().split('\n');
            
            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].match(/(?:"[^"]*"|[^,])+/g); 
                
                if (values && values.length >= headers.length) {
                    let product = {};
                    headers.forEach((header, index) => {
                        let value = values[index] ? values[index].trim() : '';
                        if (value.startsWith('"') && value.endsWith('"')) {
                            value = value.slice(1, -1);
                        }
                        product[header] = value;
                    });
                    products.push(product);
                }
            }
            return products;
        }

        function countProductsByCategory(category) {
            return allProducts.filter(p => p['CATEGORY'] === category).length;
        }

        function getCategoryImages(category) {
            // Get first 5 products images from this category
            const categoryProducts = allProducts.filter(p => p['CATEGORY'] === category);
            const images = [];
            
            for (let i = 0; i < Math.min(5, categoryProducts.length); i++) {
                let imageUrl = categoryProducts[i]['IMAGE_URL'];
                if (imageUrl) {
                    imageUrl = imageUrl.toString().replace('.avif', '');
                    if (!imageUrl.includes('<') && !imageUrl.includes('>')) {
                        images.push(imageUrl);
                    }
                }
            }
            
            // Fill with placeholders if needed
            while (images.length < 5) {
                images.push('https://via.placeholder.com/300x300/f5f5f5/999?text=📦');
            }
            
            return images;
        }

        function displayCategories() {
            const categoriesList = document.getElementById('categoriesList');
            categoriesList.innerHTML = '';

            CATEGORIES.forEach((category, index) => {
                const count = countProductsByCategory(category.name);
                const images = getCategoryImages(category.name);
                
                const card = document.createElement('div');
                card.className = 'category-card';
                card.style.animationDelay = `${index * 0.05}s`;
                card.onclick = () => showProducts(category.name);
                
                card.innerHTML = `
                    <div class="category-images">
                        <img class="category-image-large" 
                             src="${images[0]}" 
                             alt="${category.name}"
                             onerror="if(!this.dataset.tried){this.dataset.tried='1';this.src='https://images.weserv.nl/?url='+encodeURIComponent('${images[0]}');}else{this.src='https://via.placeholder.com/300x300/f5f5f5/999?text=📦';}">
                        <img src="${images[1]}" 
                             alt="${category.name}"
                             onerror="if(!this.dataset.tried){this.dataset.tried='1';this.src='https://images.weserv.nl/?url='+encodeURIComponent('${images[1]}');}else{this.src='https://via.placeholder.com/300x300/f5f5f5/999?text=📦';}">
                        <img src="${images[2]}" 
                             alt="${category.name}"
                             onerror="if(!this.dataset.tried){this.dataset.tried='1';this.src='https://images.weserv.nl/?url='+encodeURIComponent('${images[2]}');}else{this.src='https://via.placeholder.com/300x300/f5f5f5/999?text=📦';}">
                        <img src="${images[3]}" 
                             alt="${category.name}"
                             onerror="if(!this.dataset.tried){this.dataset.tried='1';this.src='https://images.weserv.nl/?url='+encodeURIComponent('${images[3]}');}else{this.src='https://via.placeholder.com/300x300/f5f5f5/999?text=📦';}">
                        <img src="${images[4]}" 
                             alt="${category.name}"
                             onerror="if(!this.dataset.tried){this.dataset.tried='1';this.src='https://images.weserv.nl/?url='+encodeURIComponent('${images[4]}');}else{this.src='https://via.placeholder.com/300x300/f5f5f5/999?text=📦';}">
                    </div>
                    <div class="category-info">
                        <div class="category-title">${category.name}</div>
                        <div class="category-count">${count} products</div>
                    </div>
                `;
                
                categoriesList.appendChild(card);
            });
        }

        function showCategories() {
            document.getElementById('categoriesView').classList.remove('hidden');
            document.getElementById('productsView').classList.add('hidden');
            document.querySelector('.subtitle').textContent = 'בחר קטגוריה לצפייה במוצרים 🛍️';
            currentCategory = '';
        }

        function showProducts(category) {
            currentCategory = category;
            document.getElementById('categoriesView').classList.add('hidden');
            document.getElementById('productsView').classList.remove('hidden');
            document.querySelector('.subtitle').textContent = `${category} 🛍️`;
            
            applyFilters();
        }

        function applyFilters() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();

            filteredProducts = allProducts.filter(product => {
                const title = (product['TITLE'] || '').toLowerCase();
                const description = (product['DESCRIPTION'] || '').toLowerCase();
                const category = product['CATEGORY'] || '';

                const matchesSearch = !searchTerm || 
                    title.includes(searchTerm) || 
                    description.includes(searchTerm);

                const matchesCategory = category === currentCategory;

                return matchesSearch && matchesCategory;
            });

            displayProducts();
        }

        function displayProducts(append = false) {
            const productList = document.getElementById('product-list');
            const loadMoreBtn = document.getElementById('loadMoreBtn');
            
            if (!append) {
                productList.innerHTML = '';
                displayedCount = 0;
            }

            if (filteredProducts.length === 0) {
                productList.innerHTML = '<div class="loading">לא נמצאו מוצרים בקטגוריה זו 😔</div>';
                loadMoreBtn.classList.add('hidden');
                return;
            }

            const endIndex = Math.min(displayedCount + PRODUCTS_PER_LOAD, filteredProducts.length);
            const productsToShow = filteredProducts.slice(displayedCount, endIndex);

            productsToShow.forEach((product, index) => {
                const affiliateLink = product['AFFILIATE_LINK'];
                const regularLink = product['PRODUCT_URL'];
                const finalLink = affiliateLink && affiliateLink.length > 5 ? affiliateLink : regularLink;
                
                const title = product['TITLE'];
                const description = product['DESCRIPTION'];
                let imageUrl = product['IMAGE_URL'];
                
                if (imageUrl) {
                    imageUrl = imageUrl.toString().replace('.avif', ''); 
                    if (imageUrl.includes('<') || imageUrl.includes('>')) {
                        imageUrl = ''; 
                    }
                }

                if (finalLink && title && imageUrl) {
                    const card = document.createElement('a');
                    card.href = finalLink;
                    card.target = '_blank';
                    card.rel = 'nofollow noopener noreferrer';
                    card.className = 'product-card';
                    card.style.animationDelay = `${index * 0.05}s`;
                    
                    card.innerHTML = `
                        <div class="product-image-container">
                            <img src="${imageUrl}" 
                                 alt="${title}"
                                 onerror="if(!this.dataset.tried){this.dataset.tried='1';this.src='https://images.weserv.nl/?url='+encodeURIComponent('${imageUrl}');}else if(this.dataset.tried==='1'){this.dataset.tried='2';this.src='https://via.placeholder.com/300x300/f5f5f5/999?text=📦';}">
                        </div>
                        <div class="product-info">
                            <div class="product-title">${title}</div>
                            <div class="product-description">${description || 'לחץ לפרטים נוספים'}</div>
                        </div>
                    `;
                    
                    productList.appendChild(card);
                }
            });
            
            displayedCount = endIndex;
            
            if (displayedCount >= filteredProducts.length) {
                loadMoreBtn.classList.add('hidden');
            } else {
                loadMoreBtn.classList.remove('hidden');
                loadMoreBtn.textContent = `טען עוד (${filteredProducts.length - displayedCount} מוצרים נותרו)`;
            }
        }

        function loadMoreProducts() {
            displayProducts(true);
        }

        async function loadProducts() {
            const categoriesList = document.getElementById('categoriesList');
            
            categoriesList.innerHTML = '<div class="loading">טוען מוצרים...</div>';

            try {
                const response = await fetch(SHEET_URL);
                const csvText = await response.text();
                
                allProducts = parseCSV(csvText, HEADERS);
                allProducts.reverse();
                
                displayCategories();
                
            } catch (error) {
                categoriesList.innerHTML = '<div class="loading">שגיאה בטעינת המוצרים 😞</div>';
                console.error('Error:', error);
            }
        }

        // Category search functionality
        document.addEventListener('DOMContentLoaded', () => {
            loadProducts();
            
            // Product search
            document.getElementById('searchInput').addEventListener('input', applyFilters);
            
            // Category search (optional enhancement)
            document.getElementById('categorySearch').addEventListener('input', function() {
                const searchTerm = this.value.toLowerCase();
                const categoryCards = document.querySelectorAll('.category-card');
                
                categoryCards.forEach(card => {
                    const title = card.querySelector('.category-title').textContent.toLowerCase();
                    if (title.includes(searchTerm) || searchTerm === '') {
                        card.style.display = 'block';
                    } else {
                        card.style.display = 'none';
                    }
                });
            });
        });
    </script>
</body>
</html>
