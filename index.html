<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-SOLUTIONS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* --- סגנונות כלליים למצב כהה --- */
        body {
            background-color: #0a0a0a;
            color: #ffffff;
        }

        /* --- סגנונות Navbar חדש --- */
        .top-navbar {
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(15px);
            padding: 15px 0;
            border-bottom: 1px solid rgba(93, 100, 242, 0.2);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
        }
        .navbar-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            flex-direction: row !important;
            direction: ltr !important;
        }
        
        .navbar-container .logo-section {
            order: 1;
        }
        
        .navbar-container .search-section {
            order: 2;
        }
        .logo-section {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-direction: row;
        }
        .navbar-brand-logo {
            height: 60px; width: auto;
        }
        .brand-text {
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(45deg, #5d64f2, #764def);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
        }
        .search-section {
            flex-grow: 1;
            max-width: 500px;
            margin-left: 30px;
        }
        .search-input {
            width: 100%;
            padding: 10px 15px;
            border-radius: 25px;
            border: 1px solid rgba(93, 100, 242, 0.3);
            background: rgba(20, 20, 30, 0.7);
            backdrop-filter: blur(10px);
            color: #ffffff;
            font-size: 0.95rem;
            transition: all 0.3s;
        }
        .search-input:focus {
            outline: none;
            border-color: #764def;
            background: rgba(20, 20, 30, 0.9);
            box-shadow: 0 0 20px rgba(118, 77, 239, 0.4);
        }
        .search-input::placeholder {
            color: #888;
        }

        /* --- סגנונות פילטרים --- */
        .filters-section {
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            margin: 20px auto;
            max-width: 600px;
            border-radius: 50px;
            border: 1px solid rgba(93, 100, 242, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }
        .filter-row {
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }
        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .filter-label {
            color: #888;
            font-size: 0.85rem;
            font-weight: 500;
            margin: 0;
            white-space: nowrap;
        }
        .sort-select {
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid rgba(93, 100, 242, 0.4);
            background: rgba(26, 26, 46, 0.6);
            color: #ffffff;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .sort-select:focus {
            outline: none;
            border-color: #764def;
            background: rgba(26, 26, 46, 0.9);
            box-shadow: 0 0 15px rgba(118, 77, 239, 0.4);
        }
        .sort-select:hover {
            border-color: #5d64f2;
            background: rgba(26, 26, 46, 0.8);
        }
        .reset-btn {
            padding: 8px 18px;
            background: rgba(26, 26, 46, 0.6);
            border: 1px solid rgba(93, 100, 242, 0.4);
            color: #888;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
            white-space: nowrap;
        }
        .reset-btn:hover {
            background: rgba(118, 77, 239, 0.2);
            color: #764def;
            border-color: #764def;
            box-shadow: 0 0 15px rgba(118, 77, 239, 0.3);
        }

        /* --- סגנונות כרטיס מוצר --- */
        .product-card {
            border: 1px solid rgba(93, 100, 242, 0.2);
            background: rgba(15, 15, 25, 0.8);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
            margin-bottom: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            text-align: right;
            border-radius: 15px; 
        }
        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 35px rgba(118, 77, 239, 0.5);
            border-color: rgba(118, 77, 239, 0.6);
        }
        .card-title {
            color: #f8f9fa;
            font-size: 1.25rem;
            font-weight: 600;
            height: 50px;
            overflow: hidden;
        }
        .card-text {
            height: 70px;
            overflow: hidden;
            font-size: 0.9rem;
            color: #aaaaaa;
            line-height: 1.5;
        }
        
        /* --- סגנונות תמונה (מוצר) --- */
        .product-image {
            height: 220px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(240, 240, 245, 0.95);
            border-radius: 15px 15px 0 0;
            padding: 15px;
        }
        .product-image a {
            display: block;
            height: 100%;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .product-image img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
        }
        .card-body {
            flex-grow: 1;
            padding: 15px;
        }
        .btn-buy {
            width: 100%;
            font-size: 1.1rem;
            background: linear-gradient(135deg, #5d64f2, #764def);
            border: none;
            transition: all 0.3s;
        }
        .btn-buy:hover {
            background: linear-gradient(135deg, #764def, #5d64f2);
            transform: scale(1.02);
            box-shadow: 0 4px 15px rgba(118, 77, 239, 0.5);
        }

        /* --- רספונסיביות: 4 כרטיסים בשורה ברזולוציות רחבות --- */
        @media (min-width: 768px) {
            .col-md-4 {
                width: calc(25% - 2.25px);
                margin-top: 0;
            }
            #product-list {
                row-gap: 3px;
                column-gap: 3px;
            }
        }
        
        @media (min-width: 576px) and (max-width: 767.98px) {
            .col-sm-6 {
                width: calc(50% - 1.5px);
                margin-top: 0;
            }
            #product-list {
                justify-content: flex-start;
                row-gap: 3px;
                column-gap: 3px;
            }
        }

        /* --- רספונסיביות: הקטנת רוחב ומרכוז בסלולר --- */
        @media (max-width: 575.98px) {
            .col-sm-6 {
                width: calc(50% - 1.5px);
                margin-top: 0;
            }
            #product-list {
                justify-content: flex-start;
                padding: 0 8px;
                row-gap: 3px;
                column-gap: 3px;
            }
            .navbar-container {
                flex-direction: column;
                gap: 15px;
            }
            .search-section {
                margin: 0;
                max-width: 100%;
            }
            .filters-section {
                max-width: 90%;
                padding: 12px 15px;
            }
            .filter-row {
                gap: 10px;
            }
            .product-card {
                font-size: 0.85rem;
                margin-bottom: 0;
            }
            .card-title {
                font-size: 1rem;
                height: 40px;
            }
            .card-text {
                font-size: 0.8rem;
                height: 60px;
            }
            .btn-buy {
                font-size: 0.9rem;
                padding: 8px;
            }
            .product-image {
                height: 180px;
            }
        }

        /* --- מרווח קטן מאוד בין כרטיסים --- */
        #product-list {
            row-gap: 3px;
            column-gap: 3px;
        }

        /* --- טקסט תוצאות חיפוש --- */
        .results-count {
            color: #764def;
            font-size: 1rem;
            margin: 15px 0;
            text-align: right;
            font-weight: 600;
        }

        /* --- כפתורי קטגוריות --- */
        .categories-section {
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(10px);
            padding: 30px 20px;
            margin: 20px auto;
            max-width: 1200px;
            border-radius: 25px;
            border: 1px solid rgba(93, 100, 242, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        
        .categories-title {
            text-align: center;
            color: #f8f9fa;
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 25px;
            background: linear-gradient(135deg, #5d64f2, #764def);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            max-width: 1100px;
            margin: 0 auto;
        }
        
        .category-btn {
            background: linear-gradient(135deg, #5d64f2, #764def);
            border: none;
            border-radius: 20px;
            padding: 20px 15px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(118, 77, 239, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .category-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(118, 77, 239, 0.5);
        }
        
        .category-btn.active {
            background: linear-gradient(135deg, #4ade80, #22c55e);
            box-shadow: 0 8px 25px rgba(74, 222, 128, 0.5);
            transform: scale(1.05);
        }
        
        .category-btn .emoji {
            font-size: 1.5rem;
        }
        
        @media (max-width: 575.98px) {
            .categories-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .category-btn {
                padding: 15px 10px;
                font-size: 0.95rem;
                flex-direction: column;
                gap: 5px;
            }
        }

    </style>
</head>
<body>

    <!-- Navbar חדש -->
    <nav class="top-navbar">
        <div class="navbar-container">
            <div class="logo-section">
                <img src="img/logo.png" alt="M-SOLUTIONS Logo" class="navbar-brand-logo">
                <h1 class="brand-text">M-SOLUTIONS</h1>
            </div>
            <div class="search-section">
                <input type="text" id="searchInput" class="search-input" placeholder="חפש מוצרים...">
            </div>
        </div>
    </nav>
    
    <header class="main-header-bg" style="display: none;"></header> 
    
    <!-- קטגוריות -->
    <section class="categories-section">
        <h2 class="categories-title">קטגוריות שלך</h2>
        <div class="categories-grid">
            <button class="category-btn" onclick="filterByCategory('מוצרי חשמל', this)">
                <span class="emoji">🔌</span>
                <span>מוצרי חשמל</span>
            </button>
            <button class="category-btn" onclick="filterByCategory('מטבח ובית', this)">
                <span class="emoji">🍳</span>
                <span>מטבח ובית</span>
            </button>
            <button class="category-btn" onclick="filterByCategory('ספורט וכושר', this)">
                <span class="emoji">⚽</span>
                <span>ספורט וכושר</span>
            </button>
            <button class="category-btn" onclick="filterByCategory('תיקים ואביזרים', this)">
                <span class="emoji">👜</span>
                <span>תיקים ואביזרים</span>
            </button>
            <button class="category-btn" onclick="filterByCategory('כלי עבודה', this)">
                <span class="emoji">🔧</span>
                <span>כלי עבודה</span>
            </button>
            <button class="category-btn" onclick="filterByCategory('צעצועים', this)">
                <span class="emoji">🎮</span>
                <span>צעצועים</span>
            </button>
            <button class="category-btn" onclick="filterByCategory('אופנה', this)">
                <span class="emoji">👔</span>
                <span>אופנה</span>
            </button>
            <button class="category-btn" onclick="filterByCategory('אלקטרוניקה', this)">
                <span class="emoji">📱</span>
                <span>אלקטרוניקה</span>
            </button>
            <button class="category-btn" onclick="filterByCategory('כללי', this)">
                <span class="emoji">📦</span>
                <span>כללי</span>
            </button>
        </div>
    </section>

    
    <div class="container mt-4">
        <!-- סקשן פילטרים -->
        <div class="filters-section">
            <div class="filter-row">
                <div class="filter-group">
                    <label class="filter-label">מיון:</label>
                    <select id="sortSelect" class="sort-select">
                        <option value="default">ברירת מחדל</option>
                        <option value="name-asc">א-ת</option>
                        <option value="name-desc">ת-א</option>
                    </select>
                </div>
                
                <div class="filter-group">
                    <button id="resetBtn" class="reset-btn">אפס</button>
                </div>
            </div>
        </div>
        
        <!-- תוצאות חיפוש -->
        <div id="resultsCount" class="results-count"></div>
        
        <div id="product-list" class="row">
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRcIf9Ew8DK7FY7Bpys2hDumQBd0qXrtcNjxYmYuL6yLWrfb0r4l3tX1XcmytUksxl4ZqYZO0LfC3SE/pub?gid=725361923&single=true&output=csv'; 
    
    const HEADERS = [
        "TITLE",
        "IMAGE_URL",
        "PRODUCT_URL",
        "AFFILIATE_LINK",
        "DESCRIPTION",
        "KEYWORDS",
        "CATEGORY"
    ];

    let allProducts = [];
    let filteredProducts = [];

    function parseCSV(csvText, headers) {
        const products = [];
        const lines = csvText.trim().split('\n');
        
        for (let i = 1; i < lines.length; i++) {
            const values = lines[i].match(/(?:"[^"]*"|[^,])+/g); 
            
            if (values && values.length >= headers.length) {
                let product = {};
                headers.forEach((header, index) => {
                    let value = values[index] ? values[index].trim() : '';
                    if (value.startsWith('"') && value.endsWith('"')) {
                        value = value.slice(1, -1);
                    }
                    product[header] = value;
                });
                products.push(product);
            }
        }
        return products;
    }

    function applyFilters() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const sortBy = document.getElementById('sortSelect').value;

        // פילטור
        filteredProducts = allProducts.filter(product => {
            const title = (product['TITLE'] || '').toLowerCase();
            const description = (product['DESCRIPTION'] || '').toLowerCase();
            const category = product['CATEGORY'] || '';

            // חיפוש טקסט
            const matchesSearch = !searchTerm || 
                title.includes(searchTerm) || 
                description.includes(searchTerm);

            // סינון לפי קטגוריה
            const matchesCategory = !selectedCategory || category === selectedCategory;

            return matchesSearch && matchesCategory;
        });

        // מיון
        if (sortBy === 'name-asc') {
            filteredProducts.sort((a, b) => (a['TITLE'] || '').localeCompare(b['TITLE'] || '', 'he'));
        } else if (sortBy === 'name-desc') {
            filteredProducts.sort((a, b) => (b['TITLE'] || '').localeCompare(a['TITLE'] || '', 'he'));
        }

        displayProducts();
    }

    function displayProducts() {
        const productList = document.getElementById('product-list');
        const resultsCount = document.getElementById('resultsCount');
        productList.innerHTML = '';

        // עדכון מספר התוצאות
        resultsCount.textContent = `${filteredProducts.length} תוצאות נמצאו`;

        if (filteredProducts.length === 0) {
            productList.innerHTML = `<div class="alert alert-info" role="alert" dir="rtl">לא נמצאו מוצרים התואמים לחיפוש.</div>`;
            return;
        }

        filteredProducts.forEach(product => {
            const affiliateLink = product['AFFILIATE_LINK'];
            const regularLink = product['PRODUCT_URL'];
            const finalLink = affiliateLink && affiliateLink.length > 5 ? affiliateLink : regularLink;
            
            const title = product['TITLE'];
            const description = product['DESCRIPTION'];
            let imageUrl = product['IMAGE_URL'];
            
            if (imageUrl) {
                imageUrl = imageUrl.toString().replace('.avif', ''); 
                if (imageUrl.includes('<') || imageUrl.includes('>')) {
                    imageUrl = ''; 
                }
            }

            if (finalLink && title && imageUrl) { 
                const imageOnError = "this.onerror=null; this.src='https://placehold.co/250x250?text=No+Image'";

                const cardHtml = `
                    <div class="col-md-4 col-sm-6">
                        <div class="product-card">
                            <a href="${finalLink}" target="_blank" rel="nofollow noopener noreferrer" style="text-decoration: none; color: inherit;">
                                <div class="product-image">
                                    <img src="${imageUrl}" alt="${title} - תמונה" onerror="${imageOnError}">
                                </div>
                            </a>
                            <div class="card-body">
                                <h5 class="card-title">${title}</h5>
                                <p class="card-text">${description || 'אין תיאור.'}</p>
                                <a href="${finalLink}" target="_blank" rel="nofollow noopener noreferrer" class="btn btn-primary btn-buy">Link To AliExpress</a>
                            </div>
                        </div>
                    </div>
                `;
                productList.innerHTML += cardHtml;
            }
        });
    }

    async function loadProducts() {
        const productList = document.getElementById('product-list');
        
        if (!productList) {
            console.error("Error: Element with ID 'product-list' not found.");
            return;
        }

        productList.innerHTML = 'טוען מוצרים...';

        try {
            const response = await fetch(SHEET_URL);
            const csvText = await response.text();
            
            allProducts = parseCSV(csvText, HEADERS);
            filteredProducts = [...allProducts];
            
            displayProducts();
            
        } catch (error) {
            productList.innerHTML = `<div class="alert alert-danger" role="alert" dir="rtl">
                                        שגיאה בטעינת הנתונים מה-CSV. ודא שהקישור נכון.
                                        <br>פרטי שגיאה: ${error.message}
                                    </div>`;
            console.error('Error loading products:', error);
        }
    }

    // אפס פילטרים
    function resetFilters() {
        document.getElementById('searchInput').value = '';
        document.getElementById('sortSelect').value = 'default';
        applyFilters();
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadProducts();

        // מאזינים לפילטרים
        document.getElementById('searchInput').addEventListener('input', applyFilters);
        document.getElementById('sortSelect').addEventListener('change', applyFilters);
        document.getElementById('resetBtn').addEventListener('click', resetFilters);
    });
</script>


<!-- ========================================= -->
<!-- הוסף את הקוד הזה ל-HTML הקיים שלך     -->
<!-- העתק והדבק לפני תגית </body> הסוגרת   -->
<!-- ========================================= -->

<script>
    // תיקון אוטומטי לתמונות שנכשלות - ללא שינוי עיצוב!
    document.addEventListener('DOMContentLoaded', function() {
        
        // מצא את כל התמונות בדף
        const images = document.querySelectorAll('img');
        
        images.forEach(function(img) {
            
            // שמור את ה-URL המקורי
            const originalSrc = img.src;
            
            // פונקציה שמטפלת בשגיאה
            img.onerror = function() {
                
                // אם זה הניסיון הראשון
                if (!this.dataset.tried) {
                    this.dataset.tried = '1';
                    
                    // נסה דרך Proxy (עוקף חסימות של AliExpress)
                    const proxyUrl = 'https://images.weserv.nl/?url=' + 
                        originalSrc.replace('https://', '').replace('http://', '');
                    
                    console.log('ניסיון 2: Proxy -', proxyUrl);
                    this.src = proxyUrl;
                    
                } else if (this.dataset.tried === '1') {
                    this.dataset.tried = '2';
                    
                    // אם גם Proxy לא עבד - תמונת fallback
                    this.src = 'https://via.placeholder.com/400x400/e0e0e0/666666?text=No+Image';
                    console.log('ניסיון 3: Placeholder');
                }
            };
            
            // אם התמונה כבר נכשלה בטעינה
            if (img.complete && img.naturalHeight === 0) {
                img.onerror();
            }
        });
    });

    // סינון לפי קטגוריה
    let selectedCategory = '';
    
    function filterByCategory(category, btnElement) {
        // הסרת active מכל הכפתורים
        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.classList.remove('active');
        });
        
        // אם לחצנו על אותה קטגוריה - בטל סינון
        if (selectedCategory === category) {
            selectedCategory = '';
        } else {
            // סינון קטגוריה חדשה
            selectedCategory = category;
            btnElement.classList.add('active');
        }
        
        // סינון המוצרים - עכשיו באמת!
        applyFilters();
    }

    </script>
</body>
</html>
