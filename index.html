<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-SOLUTIONS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        /* Sidebar */
        .sidebar {
            position: fixed;
            right: 0;
            top: 0;
            width: 280px;
            height: 100vh;
            background: linear-gradient(180deg, #1a1a2e 0%, #0f0f1e 100%);
            padding: 30px 20px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: -2px 0 10px rgba(0,0,0,0.5);
        }
        
        .sidebar-logo {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .sidebar-logo h2 {
            color: #5b86e5;
            font-size: 24px;
            font-weight: 700;
            margin-top: 10px;
        }
        
        .sidebar-logo img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
        }
        
        .filter-section {
            margin-bottom: 30px;
        }
        
        .filter-title {
            font-size: 14px;
            font-weight: 600;
            color: #8b8b8b;
            text-transform: uppercase;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        
        .filter-option {
            padding: 10px 15px;
            margin-bottom: 8px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }
        
        .filter-option:hover {
            background: rgba(91,134,229,0.2);
            transform: translateX(-3px);
        }
        
        .filter-option.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .price-range {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-top: 10px;
        }
        
        .price-input {
            width: 100px;
            padding: 8px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            color: white;
            text-align: center;
        }
        
        .filter-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-weight: 600;
        }
        
        .clear-filters {
            background: rgba(255,59,48,0.2);
            color: #ff3b30;
            border: 1px solid #ff3b30;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .clear-filters:hover {
            background: #ff3b30;
            color: white;
        }
        
        /* Main Content */
        .main-content {
            margin-right: 280px;
            padding: 30px;
        }
        
        /* Search Bar */
        .search-container {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px;
            border-radius: 15px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(102,126,234,0.3);
        }
        
        .search-box {
            display: flex;
            background: white;
            border-radius: 50px;
            overflow: hidden;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .search-input {
            flex: 1;
            border: none;
            padding: 15px 25px;
            font-size: 16px;
            outline: none;
        }
        
        .search-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 15px 35px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        /* Product Cards - Bootstrap Grid */
        .product-card {
            border: 1px solid #333333;
            background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: transform 0.3s;
            margin-bottom: 25px;
            height: 100%;
            display: flex;
            flex-direction: column;
            text-align: right;
            border-radius: 15px;
        }
        
        .product-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(102,126,234,0.4);
        }
        
        .card-title {
            color: #e0e0e0;
            font-size: 1.1rem;
            font-weight: 600;
            height: 50px;
            overflow: hidden;
        }
        
        .card-text {
            height: 70px;
            overflow: hidden;
            font-size: 0.9rem;
            color: #8b8b8b;
            line-height: 1.5;
        }
        
        .product-price {
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            direction: ltr;
        }
        
        .product-image {
            height: 250px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea20 0%, #764ba220 100%);
            position: relative;
        }
        
        .product-image a {
            display: block;
            height: 100%;
            width: 100%;
        }
        
        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 10px;
            transition: transform 0.3s ease;
        }
        
        .product-card:hover .product-image img {
            transform: scale(1.05);
        }
        
        .card-body {
            flex-grow: 1;
            padding: 15px;
        }
        
        .btn-buy {
            width: 100%;
            font-size: 1rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px;
            border-radius: 25px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        .btn-buy:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(102,126,234,0.5);
        }

        /* Bootstrap Grid Adjustments */
        @media (min-width: 768px) {
            .col-md-4 {
                width: 33.333%;
            }
        }

        @media (min-width: 992px) {
            .col-md-4 {
                width: 33.333%;
            }
        }

        @media (max-width: 575.98px) {
            .col-sm-6 {
                width: 100%;
                margin-left: auto;
                margin-right: auto;
            }
        }
        
        /* Mobile */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }
            
            .main-content {
                margin-right: 0;
                padding: 15px;
            }
            
            .search-container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-logo">
            <img src="img/MSolutions.png" alt="M-SOLUTIONS" onerror="this.style.display='none'">
            <h2>M SOLUTIONS</h2>
        </div>
        
        <div class="filter-section">
            <div class="filter-title">טווח מחירים</div>
            <div class="price-range">
                <input type="number" class="price-input" id="minPrice" placeholder="מינ׳">
                <span>-</span>
                <input type="number" class="price-input" id="maxPrice" placeholder="מקס׳">
            </div>
            <button class="filter-btn" onclick="applyFilters()">סנן</button>
        </div>
        
        <div class="filter-section" id="categoryFilters">
            <div class="filter-title">קטגוריות</div>
        </div>
        
        <button class="clear-filters" onclick="clearFilters()">נקה פילטרים</button>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="search-container">
            <div class="search-box">
                <input type="text" class="search-input" id="searchInput" placeholder="חפש מוצרים...">
                <button class="search-btn" onclick="searchProducts()">חיפוש</button>
            </div>
        </div>

        <div class="container mt-4"> 
            <div id="product-list" class="row">
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRcIf9Ew8DK7FY7Bpys2hDumQBd0qXrtcNjxYmYuL6yLWrfb0r4l3tX1XcmytUksxl4ZqYZO0LfC3SE/pub?gid=725361923&single=true&output=csv'; 
        
        const HEADERS = [
            "PRODUCT_URL", 
            "TITLE", 
            "DESCRIPTION", 
            "PRICE", 
            "IMAGE_URL", 
            "AFFILIATE_LINK" 
        ];

        let allProducts = [];
        let categories = new Set();

        function parseCSV(csvText, headers) {
            const products = [];
            const lines = csvText.trim().split('\n');
            
            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].match(/(?:"[^"]*"|[^,])+/g); 
                
                if (values && values.length >= headers.length) {
                    let product = {};
                    headers.forEach((header, index) => {
                        let value = values[index] ? values[index].trim() : '';
                        if (value.startsWith('"') && value.endsWith('"')) {
                            value = value.slice(1, -1);
                        }
                        product[header] = value;
                    });
                    products.push(product);
                }
            }
            return products;
        }

        function extractCategory(title, description) {
            const text = (title + ' ' + description).toLowerCase();
            
            if (text.includes('טלוויזיה') || text.includes('tv') || text.includes('מסך')) return 'טלוויזיות';
            if (text.includes('אוזניות') || text.includes('אודיו') || text.includes('earbuds')) return 'אודיו';
            if (text.includes('רובוט') || text.includes('שואב')) return 'ניקיון';
            if (text.includes('מטען') || text.includes('כבל') || text.includes('charger')) return 'אביזרים';
            if (text.includes('שעון') || text.includes('watch')) return 'שעונים';
            if (text.includes('מקרן') || text.includes('projector')) return 'מקרנים';
            
            return 'אחר';
        }

        function renderProducts(products) {
            const productList = document.getElementById('product-list');
            
            if (!productList) {
                console.error("Error: Element with ID 'product-list' not found.");
                return;
            }

            productList.innerHTML = '';
            
            if (products.length === 0) {
                productList.innerHTML = `<div class="alert alert-info" role="alert" dir="rtl">לא נמצאו מוצרים להצגה.</div>`;
                return;
            }

            products.forEach(product => {
                const affiliateLink = product['AFFILIATE_LINK'];
                const regularLink = product['PRODUCT_URL'];
                const finalLink = affiliateLink && affiliateLink.length > 5 ? affiliateLink : regularLink;
                
                const title = product['TITLE'];
                const description = product['DESCRIPTION'];
                let price = product['PRICE'];
                let imageUrl = product['IMAGE_URL'];
                
                if (imageUrl) {
                    imageUrl = imageUrl.toString().replace('.avif', ''); 
                    if (imageUrl.includes('<') || imageUrl.includes('>')) {
                        imageUrl = ''; 
                    }
                }

                if (finalLink && title && (imageUrl || price)) { 
                    if (price && price.toString().trim() !== '') {
                        price = price.toString().replace('$', '').replace('₪', '').replace(/[\(\)]/g, '').trim();
                        price = `₪${price}`; 
                    } else {
                        price = "₪XX.XX (עדכן)";
                    }
                    
                    const imageOnError = "this.onerror=null; this.src='https://placehold.co/250x250?text=No+Image'";

                    const cardHtml = `
                        <div class="col-md-4 col-sm-6">
                            <div class="product-card">
                                <a href="${finalLink}" target="_blank" rel="nofollow noopener noreferrer" style="text-decoration: none; color: inherit;">
                                    <div class="product-image">
                                        <img src="${imageUrl}" alt="${title} - תמונה" onerror="${imageOnError}">
                                    </div>
                                </a>

                                <div class="card-body">
                                    <h5 class="card-title">${title}</h5>
                                    <p class="card-text">${description || 'אין תיאור.'}</p>
                                    <div class="product-price">${price}</div>
                                    <a href="${finalLink}" target="_blank" rel="nofollow noopener noreferrer" class="btn btn-primary btn-buy">SHOP NOW</a>
                                </div>
                            </div>
                        </div>
                    `;
                    productList.innerHTML += cardHtml;
                }
            });
        }

        function buildCategories() {
            allProducts.forEach(product => {
                const category = extractCategory(product['TITLE'], product['DESCRIPTION']);
                categories.add(category);
            });
            
            const container = document.getElementById('categoryFilters');
            container.innerHTML = '<div class="filter-title">קטגוריות</div>';
            
            categories.forEach(category => {
                const option = document.createElement('div');
                option.className = 'filter-option';
                option.textContent = category;
                option.onclick = () => filterByCategory(category, option);
                container.appendChild(option);
            });
        }

        function filterByCategory(category, element) {
            document.querySelectorAll('.filter-option').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            
            const filtered = allProducts.filter(p => {
                const cat = extractCategory(p['TITLE'], p['DESCRIPTION']);
                return cat === category;
            });
            renderProducts(filtered);
        }

        function applyFilters() {
            const minPrice = parseFloat(document.getElementById('minPrice').value) || 0;
            const maxPrice = parseFloat(document.getElementById('maxPrice').value) || Infinity;
            
            const filtered = allProducts.filter(product => {
                const priceStr = product['PRICE'] || '0';
                const price = parseFloat(priceStr.replace(/[^0-9.]/g, ''));
                return price >= minPrice && price <= maxPrice;
            });
            
            renderProducts(filtered);
        }

        function clearFilters() {
            document.getElementById('minPrice').value = '';
            document.getElementById('maxPrice').value = '';
            document.getElementById('searchInput').value = '';
            document.querySelectorAll('.filter-option').forEach(el => el.classList.remove('active'));
            renderProducts(allProducts);
        }

        function searchProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            
            if (!query) {
                renderProducts(allProducts);
                return;
            }
            
            const filtered = allProducts.filter(product => 
                (product['TITLE'] || '').toLowerCase().includes(query) ||
                (product['DESCRIPTION'] || '').toLowerCase().includes(query)
            );
            
            renderProducts(filtered);
        }

        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchProducts();
        });

        async function loadProducts() {
            const productList = document.getElementById('product-list');
            
            if (!productList) {
                console.error("Error: Element with ID 'product-list' not found.");
                return;
            }

            productList.innerHTML = 'טוען מוצרים...';

            try {
                const response = await fetch(SHEET_URL);
                const csvText = await response.text();
                
                allProducts = parseCSV(csvText, HEADERS);
                
                if (allProducts.length === 0) {
                    productList.innerHTML = `<div class="alert alert-info" role="alert" dir="rtl">לא נמצאו מוצרים להצגה.</div>`;
                    return;
                }

                buildCategories();
                renderProducts(allProducts);
                
            } catch (error) {
                productList.innerHTML = `<div class="alert alert-danger" role="alert" dir="rtl">
                                            שגיאה בטעינת הנתונים מה-CSV. ודא שהקישור נכון.
                                            <br>פרטי שגיאה: ${error.message}
                                        </div>`;
                console.error('Error loading products:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadProducts();
        });
    </script>
</body>
</html>
