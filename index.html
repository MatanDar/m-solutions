<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-SOLUTIONS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* --- שינויים למצב כהה (Dark Mode) --- */
        body {
            background-color: #000000; /* רקע שחור מלא */
            color: #ffffff; /* צבע טקסט לבן כברירת מחדל */
        }
        
        /* כרטיס מוצר - שינוי רקע וגבולות להתאמה למצב כהה */
        .product-card {
            border: 1px solid #333333; /* גבולות כהים יותר */
            background-color: #1a1a1a; /* רקע כהה לכרטיס עצמו */
            box-shadow: 0 4px 8px rgba(255, 255, 255, 0.1); /* צל בהיר יותר */
            transition: transform 0.2s;
            margin-bottom: 20px;
            height: 100%;
            display: flex;
            flex-direction: column;
            text-align: right; /* יישור לימין לטקסט בעברית */
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(255, 255, 255, 0.3);
        }
        
        /* צבעי טקסט בתוך הכרטיס */
        .card-title {
            color: #f8f9fa; /* כותרת לבנה */
            font-size: 1.25rem;
            font-weight: 600;
            height: 50px; /* גובה קבוע לכותרת למראה אחיד */
            overflow: hidden;
        }
        .card-text {
            height: 70px; /* גובה קבוע לתיאור למראה אחיד */
            overflow: hidden;
            font-size: 0.9rem;
            color: #aaaaaa; /* טקסט תיאור בגוון אפור בהיר */
        }
        .product-price {
            font-size: 1.5rem;
            font-weight: bold;
            color: #4dc2ff; /* צבע כחול-בהיר נראה טוב יותר על רקע שחור */
            margin-bottom: 10px;
            direction: ltr; /* מחיר עם סימן דולר מוצג משמאל לימין */
        }
        
        /* כותרת ראשית M-SOLUTIONS */
        .main-header {
            color: #ffffff !important; /* כיתוב לבן */
            font-size: 2.5rem;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.3);
        }

        /* סגנונות שלא השתנו */
        .container {
            padding-top: 30px;
        }
        .product-image {
            height: 250px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* חיתוך התמונה כדי שתמלא את השטח */
        }
        .card-body {
            flex-grow: 1;
            padding: 15px;
        }
        .btn-buy {
            width: 100%;
            font-size: 1.1rem;
            background-color: #ff471a; /* צבע כפתור אדום של עלי אקספרס */
            border-color: #ff471a;
        }
        .btn-buy:hover {
            background-color: #e03c15;
            border-color: #e03c15;
        }

        /* התאמת הודעת השגיאה למצב כהה */
        .alert-danger {
            background-color: #330000;
            color: #ffaaaa;
            border-color: #800000;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 class="text-center mb-4 main-header">M-SOLUTIONS</h1> 
    <div id="product-list" class="row">
        </div>
</div>

<script>
    // ** יש להדביק כאן את הקישור ל-CSV שפרסמת בשלב 2 **
    // הקישור חייב להסתיים ב: ?output=csv
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRcIf9Ew8DK7FY7Bpys2hDumQBd0qXrtcNjxYmYuL6yLWrfb0r4l3tX1XcmytUksxl4ZqYZO0LfC3SE/pub?output=csv'; 
    
    // פונקציה לטעינת נתונים מה-CSV
    async function loadProducts() {
        const productList = document.getElementById('product-list');
        productList.innerHTML = 'טוען מוצרים...';

        try {
            const response = await fetch(SHEET_URL);
            const csvText = await response.text();
            
            // המרת CSV לפורמט שקל לעבוד איתו
            const lines = csvText.trim().split('\n');
            const headers = lines[0].split(',').map(h => h.trim());
            const products = [];

            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].split(',');
                if (values.length >= headers.length) {
                    let product = {};
                    headers.forEach((header, index) => {
                        product[header] = values[index].trim().replace(/^"|"$/g, ''); // הסרת גרשיים מיותרים
                    });
                    products.push(product);
                }
            }
            
            productList.innerHTML = ''; // מנקה את הודעת הטעינה
            
            products.forEach(product => {
                // בדיקות בסיסיות לוודא שכל הנתונים קיימים
                if (product['A. קישור אפיליאציה (AliExpress)'] && product['B. שם המוצר (כותרת)']) {
                    
                    const cardHtml = `
                        <div class="col-md-4 col-sm-6">
                            <div class="product-card">
                                <div class="product-image">
                                    <img src="${product['E. קישור לתמונה (Image URL)']}" alt="${product['B. שם המוצר (כותרת)']} - תמונה" onerror="this.onerror=null; this.src='https://via.placeholder.com/250?text=No+Image';">
                                </div>
                                <div class="card-body">
                                    <h5 class="card-title">${product['B. שם המוצר (כותרת)']}</h5>
                                    <p class="card-text">${product['C. תיאור קצר']}</p>
                                    <div class="product-price">${product['D. מחיר ($)'].startsWith('$') ? '' : '$'}${product['D. מחיר ($)']}</div>
   <a href="${product['A. קישור אפיליאציה (AliExpress)']}" target="_blank" rel="nofollow noopener noreferrer" class="btn btn-primary btn-buy">קנה עכשיו בעלי אקספרס</a>                 </div>
                            </div>
                        </div>
                    `;
                    productList.innerHTML += cardHtml;
                }
            });
            
        } catch (error) {
            productList.innerHTML = `<div class="alert alert-danger" role="alert" dir="rtl">
                                        שגיאה בטעינת הנתונים. ודא שהקישור ל-CSV נכון: ${error.message}
                                    </div>`;
            console.error('Error loading products:', error);
        }
    }

    // הפעלת הפונקציה בעת טעינת הדף
    loadProducts();
</script>
</body>
</html>
