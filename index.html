<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-SOLUTIONS | מוצרים מומלצים</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="img/logo.png">
    <link rel="apple-touch-icon" href="img/logo.png">
    
    <!-- Google Fonts - DM Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* רקע עם טקסטורה עדינה */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(99, 102, 241, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* Header */
        header {
            text-align: center;
            padding: 40px 20px;
            animation: fadeInDown 0.8s ease-out;
        }

        .logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 20px;
            background: white;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 1rem;
            color: #4a5568;
            font-weight: 400;
            margin-bottom: 30px;
        }

        /* Search Bar */
        .search-container {
            margin-bottom: 30px;
            animation: fadeIn 1s ease-out 0.2s both;
        }

        .search-input {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            background: white;
            font-size: 1rem;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.2);
        }

        .search-input::placeholder {
            color: #a0aec0;
        }

        /* Filter Buttons */
        .filter-section {
            margin-bottom: 30px;
            animation: fadeIn 1s ease-out 0.3s both;
        }

        .filter-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .filter-scroll::-webkit-scrollbar {
            display: none;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 20px;
            background: white;
            color: #4a5568;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            font-family: 'DM Sans', sans-serif;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: #667eea;
            border-color: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        /* Product Cards - Linktree Style */
        .products-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 40px;
        }

        .product-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border: 2px solid transparent;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            animation: fadeInUp 0.6s ease-out both;
        }

        .product-card:nth-child(1) { animation-delay: 0.1s; }
        .product-card:nth-child(2) { animation-delay: 0.15s; }
        .product-card:nth-child(3) { animation-delay: 0.2s; }
        .product-card:nth-child(4) { animation-delay: 0.25s; }
        .product-card:nth-child(5) { animation-delay: 0.3s; }

        .product-card:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            border-color: #667eea;
        }

        .product-image-container {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            overflow: hidden;
            flex-shrink: 0;
            background: #f7fafc;
        }

        .product-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info {
            flex: 1;
            min-width: 0;
        }

        .product-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: #1a202c;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.4;
        }

        .product-description {
            font-size: 0.85rem;
            color: #718096;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-arrow {
            color: #a0aec0;
            font-size: 1.5rem;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .product-card:hover .product-arrow {
            color: #667eea;
            transform: translateX(-4px);
        }

        /* Load More Button */
        .load-more-container {
            text-align: center;
            margin: 40px 0;
            animation: fadeIn 1s ease-out 0.5s both;
        }

        .load-more-btn {
            padding: 16px 40px;
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            color: #4a5568;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'DM Sans', sans-serif;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .load-more-btn:hover {
            background: #667eea;
            border-color: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.3);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 40px 20px 20px;
            color: #718096;
            font-size: 0.9rem;
            animation: fadeIn 1.2s ease-out 0.6s both;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #718096;
            font-size: 1.1rem;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        /* Responsive */
        @media (max-width: 640px) {
            h1 {
                font-size: 1.75rem;
            }

            .product-card {
                padding: 16px;
                gap: 16px;
            }

            .product-image-container {
                width: 70px;
                height: 70px;
            }

            .product-title {
                font-size: 0.95rem;
            }

            .filter-scroll {
                gap: 8px;
            }

            .filter-btn {
                padding: 8px 16px;
                font-size: 0.85rem;
            }
        }

        /* Hidden by default */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <div class="logo">
                <img src="img/logo.png" alt="M-SOLUTIONS" onerror="this.style.display='none'">
            </div>
            <h1>M-SOLUTIONS</h1>
            <p class="subtitle">מוצרים נבחרים במיוחד בשבילך 🛍️</p>
        </header>

        <!-- Search -->
        <div class="search-container">
            <input 
                type="text" 
                class="search-input" 
                id="searchInput"
                placeholder="🔍 חפש מוצר..."
            >
        </div>

        <!-- Filters -->
        <div class="filter-section">
            <div class="filter-scroll" id="filterButtons">
                <button class="filter-btn active" onclick="filterByCategory('', this)">🌟 הכל</button>
                <button class="filter-btn" onclick="filterByCategory('מוצרי חשמל', this)">⚡ חשמל</button>
                <button class="filter-btn" onclick="filterByCategory('מטבח ובית', this)">🏠 בית</button>
                <button class="filter-btn" onclick="filterByCategory('ספורט וכושר', this)">💪 ספורט</button>
                <button class="filter-btn" onclick="filterByCategory('תיקים ואביזרים', this)">👜 תיקים</button>
                <button class="filter-btn" onclick="filterByCategory('כלי עבודה', this)">🔧 כלים</button>
                <button class="filter-btn" onclick="filterByCategory('צעצועים', this)">🧸 צעצועים</button>
                <button class="filter-btn" onclick="filterByCategory('אופנה', this)">👗 אופנה</button>
                <button class="filter-btn" onclick="filterByCategory('מוצרים לטלפון', this)">📱 טלפון</button>
            </div>
        </div>

        <!-- Products Grid -->
        <div class="products-grid" id="productList">
            <div class="loading">טוען מוצרים</div>
        </div>

        <!-- Load More Button -->
        <div class="load-more-container">
            <button class="load-more-btn hidden" id="loadMoreBtn" onclick="loadMoreProducts()">
                טען עוד מוצרים
            </button>
        </div>

        <!-- Footer -->
        <footer>
            <p>© 2026 M-SOLUTIONS | מוצרים מומלצים מ-AliExpress</p>
        </footer>
    </div>

    <script>
        // Google Sheets CSV URL
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1oicbEsS2aU_G698uz-bd6ghUPKx7qt7dLUPFeaa4egU/export?format=csv&gid=0';
        
        const HEADERS = ['URL', 'TITLE', 'DESCRIPTION', 'IMAGE_URL', 'AFFILIATE_LINK', 'LAST_UPDATED', 'CATEGORY'];
        
        let allProducts = [];
        let filteredProducts = [];
        let displayedCount = 0;
        const PRODUCTS_PER_PAGE = 12;
        let selectedCategory = '';

        // Parse CSV
        function parseCSV(csvText, headers) {
            const lines = csvText.trim().split('\n');
            const products = [];
            
            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].split(',');
                if (values.length >= headers.length) {
                    const product = {};
                    headers.forEach((header, index) => {
                        product[header] = values[index] ? values[index].trim() : '';
                    });
                    products.push(product);
                }
            }
            
            return products;
        }

        // Apply Filters
        function applyFilters() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            filteredProducts = allProducts.filter(product => {
                const matchesCategory = !selectedCategory || product['CATEGORY'] === selectedCategory;
                const matchesSearch = !searchTerm || 
                    product['TITLE'].toLowerCase().includes(searchTerm) ||
                    product['DESCRIPTION'].toLowerCase().includes(searchTerm);
                
                return matchesCategory && matchesSearch;
            });
            
            displayedCount = 0;
            displayProducts();
        }

        // Display Products
        function displayProducts(append = false) {
            const productList = document.getElementById('product-list');
            const loadMoreBtn = document.getElementById('loadMoreBtn');
            
            if (!append) {
                productList.innerHTML = '';
                displayedCount = 0;
            }
            
            if (filteredProducts.length === 0) {
                productList.innerHTML = '<div class="loading">לא נמצאו מוצרים 😔</div>';
                loadMoreBtn.classList.add('hidden');
                return;
            }
            
            const endIndex = Math.min(displayedCount + PRODUCTS_PER_PAGE, filteredProducts.length);
            
            for (let i = displayedCount; i < endIndex; i++) {
                const product = filteredProducts[i];
                const regularLink = product['URL'];
                const affiliateLink = product['AFFILIATE_LINK'];
                const finalLink = affiliateLink && affiliateLink.length > 5 ? affiliateLink : regularLink;
                const title = product['TITLE'];
                const description = product['DESCRIPTION'];
                let imageUrl = product['IMAGE_URL'];
                
                if (imageUrl) {
                    imageUrl = imageUrl.toString().replace('.avif', '');
                    if (imageUrl.includes('<') || imageUrl.includes('>')) {
                        imageUrl = '';
                    }
                }
                
                if (finalLink && title && imageUrl) {
                    const card = document.createElement('a');
                    card.href = finalLink;
                    card.target = '_blank';
                    card.rel = 'nofollow noopener noreferrer';
                    card.className = 'product-card';
                    card.style.animationDelay = `${(i - displayedCount) * 0.05}s`;
                    
                    card.innerHTML = `
                        <div class="product-image-container">
                            <img src="${imageUrl}" 
                                 alt="${title}"
                                 onerror="if(!this.dataset.tried){this.dataset.tried='1';this.src='https://images.weserv.nl/?url='+encodeURIComponent('${imageUrl}');}else if(this.dataset.tried==='1'){this.dataset.tried='2';this.src='https://via.placeholder.com/80x80/f7fafc/a0aec0?text=📦';}">
                        </div>
                        <div class="product-info">
                            <div class="product-title">${title}</div>
                            <div class="product-description">${description || 'לחץ לפרטים נוספים'}</div>
                        </div>
                        <div class="product-arrow">←</div>
                    `;
                    
                    productList.appendChild(card);
                }
            }
            
            displayedCount = endIndex;
            
            if (displayedCount >= filteredProducts.length) {
                loadMoreBtn.classList.add('hidden');
            } else {
                loadMoreBtn.classList.remove('hidden');
                loadMoreBtn.textContent = `טען עוד (${filteredProducts.length - displayedCount} מוצרים נותרו)`;
            }
        }

        // Load More
        function loadMoreProducts() {
            displayProducts(true);
        }

        // Load Products from Google Sheets
        async function loadProducts() {
            const productList = document.getElementById('productList');
            
            try {
                const response = await fetch(SHEET_URL);
                const csvText = await response.text();
                
                allProducts = parseCSV(csvText, HEADERS);
                allProducts.reverse();
                filteredProducts = [...allProducts];
                
                displayProducts();
                
            } catch (error) {
                productList.innerHTML = '<div class="loading">שגיאה בטעינת המוצרים 😞</div>';
                console.error('Error:', error);
            }
        }

        // Filter by Category
        function filterByCategory(category, btnElement) {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            if (selectedCategory === category) {
                selectedCategory = '';
            } else {
                selectedCategory = category;
                btnElement.classList.add('active');
            }
            
            applyFilters();
        }

        // Event Listeners
        document.addEventListener('DOMContentLoaded', () => {
            loadProducts();
            document.getElementById('searchInput').addEventListener('input', applyFilters);
        });
    </script>
</body>
</html>
