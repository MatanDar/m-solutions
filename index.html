<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-SOLUTIONS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* --- סגנונות כלליים למצב כהה --- */
        body {
            background-color: #0a0a0a;
            color: #ffffff;
        }
        
        /* --- הסרת הרקע הגדול --- */

        /* --- סגנונות Navbar חדש --- */
        .top-navbar {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            padding: 15px 0;
            border-bottom: 2px solid #533483;
            box-shadow: 0 4px 6px rgba(83, 52, 131, 0.3);
        }
        .navbar-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            flex-direction: row-reverse; /* הופך את הסדר */
        }
        .logo-section {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-direction: row-reverse; /* הופך את הסדר - תמונה שמאלה, טקסט ימינה */
        }
        .navbar-brand-logo {
            height: 45px;
        }
        .brand-text {
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(45deg, #8e44ad, #a569bd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0;
        }
        .search-section {
            flex-grow: 1;
            max-width: 500px;
            margin-left: 30px; /* שינוי מימין לשמאל */
        }
        .search-input {
            width: 100%;
            padding: 10px 15px;
            border-radius: 25px;
            border: 1px solid #533483;
            background-color: #1a1a2e;
            color: #ffffff;
            font-size: 0.95rem;
        }
        .search-input:focus {
            outline: none;
            border-color: #8e44ad;
            background-color: #16213e;
            box-shadow: 0 0 10px rgba(142, 68, 173, 0.3);
        }
        .search-input::placeholder {
            color: #888;
        }

        /* --- סגנונות פילטרים --- */
        .filters-section {
            background: linear-gradient(135deg, #16213e 0%, #1a1a2e 100%);
            padding: 25px;
            margin: 30px 0;
            border-radius: 12px;
            border: 1px solid #533483;
            box-shadow: 0 4px 15px rgba(83, 52, 131, 0.2);
        }
        .filter-row {
            display: flex;
            gap: 30px;
            align-items: flex-start;
            flex-wrap: wrap;
        }
        .filter-group {
            flex: 1;
            min-width: 200px;
        }
        .filter-group.price-filter {
            min-width: 280px;
        }
        .filter-label {
            display: block;
            margin-bottom: 12px;
            color: #a569bd;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .price-range-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .price-slider-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .price-slider {
            flex-grow: 1;
            height: 6px;
            border-radius: 5px;
            background: linear-gradient(to right, #533483, #8e44ad);
            outline: none;
            -webkit-appearance: none;
        }
        .price-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #8e44ad;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(142, 68, 173, 0.6);
        }
        .price-slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #8e44ad;
            cursor: pointer;
            border: none;
        }
        .price-label {
            color: #888;
            font-size: 0.85rem;
            min-width: 80px;
        }
        .price-display {
            color: #a569bd;
            font-weight: bold;
            min-width: 90px;
            text-align: left;
            font-size: 0.95rem;
        }
        .sort-select {
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #533483;
            background-color: #1a1a2e;
            color: #ffffff;
            font-size: 0.95rem;
            cursor: pointer;
        }
        .sort-select:focus {
            outline: none;
            border-color: #8e44ad;
            box-shadow: 0 0 8px rgba(142, 68, 173, 0.3);
        }
        .reset-btn {
            padding: 8px 20px;
            background-color: #1a1a2e;
            border: 1px solid #533483;
            color: #a569bd;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
        }
        .reset-btn:hover {
            background-color: #16213e;
            color: #fff;
            border-color: #8e44ad;
        }

        /* --- סגנונות כרטיס מוצר --- */
        .product-card {
            border: 1px solid #533483;
            background: linear-gradient(135deg, #16213e 0%, #1a1a2e 100%);
            box-shadow: 0 4px 8px rgba(83, 52, 131, 0.2);
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 20px;
            height: 100%;
            display: flex;
            flex-direction: column;
            text-align: right;
            border-radius: 10px; 
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(142, 68, 173, 0.4);
            border-color: #8e44ad;
        }
        .card-title {
            color: #f8f9fa;
            font-size: 1.25rem;
            font-weight: 600;
            height: 50px;
            overflow: hidden;
        }
        .card-text {
            height: 70px;
            overflow: hidden;
            font-size: 0.9rem;
            color: #aaaaaa;
            line-height: 1.5;
        }
        .product-price {
            font-size: 1.5rem;
            font-weight: bold;
            color: #a569bd;
            margin-bottom: 10px;
            direction: ltr; 
        }
        
        /* --- סגנונות תמונה (מוצר) --- */
        .product-image {
            height: 250px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .product-image a {
            display: block;
            height: 100%;
            width: 100%;
        }
        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 10px; 
            background-color: #2a2a2a;
        }
        .card-body {
            flex-grow: 1;
            padding: 15px;
        }
        .btn-buy {
            width: 100%;
            font-size: 1.1rem;
            background: linear-gradient(135deg, #8e44ad, #533483);
            border: none;
            transition: all 0.3s;
        }
        .btn-buy:hover {
            background: linear-gradient(135deg, #a569bd, #8e44ad);
            transform: scale(1.02);
            box-shadow: 0 4px 15px rgba(142, 68, 173, 0.4);
        }

        /* --- רספונסיביות: 4 כרטיסים בשורה ברזולוציות רחבות --- */
        @media (min-width: 768px) {
            .col-md-4 {
                width: 25%;
                margin-top: 20px;
            }
        }

        /* --- רספונסיביות: הקטנת רוחב ומרכוז בסלולר --- */
        @media (max-width: 575.98px) {
            .col-sm-6 {
                width: 85%; 
                margin-left: auto;
                margin-right: auto;
                margin-top: 20px;
            }
            .navbar-container {
                flex-direction: column;
                gap: 15px;
            }
            .search-section {
                margin: 0;
                max-width: 100%;
            }
            .filter-row {
                flex-direction: column;
            }
        }

        /* --- מרווח 20px בין שורות --- */
        #product-list {
            row-gap: 20px;
        }
    </style>
</head>
<body>

    <!-- Navbar חדש -->
    <nav class="top-navbar">
        <div class="navbar-container">
            <div class="logo-section">
                <img src="img/MSolutions.png" alt="M-SOLUTIONS Logo" class="navbar-brand-logo">
                <h1 class="brand-text">M-SOLUTIONS</h1>
            </div>
            <div class="search-section">
                <input type="text" id="searchInput" class="search-input" placeholder="חפש מוצרים...">
            </div>
        </div>
    </nav>
    
    <header class="main-header-bg" style="display: none;"></header> 
    
    <div class="container mt-4">
        <!-- סקשן פילטרים -->
        <div class="filters-section">
            <div class="filter-row">
                <div class="filter-group price-filter">
                    <label class="filter-label">טווח מחירים</label>
                    <div class="price-range-container">
                        <div class="price-slider-row">
                            <span class="price-label">מינימום:</span>
                            <input type="range" id="minPrice" class="price-slider" min="0" max="1000" value="0">
                            <span class="price-display" id="minPriceDisplay">₪0</span>
                        </div>
                        <div class="price-slider-row">
                            <span class="price-label">מקסימום:</span>
                            <input type="range" id="maxPrice" class="price-slider" min="0" max="1000" value="1000">
                            <span class="price-display" id="maxPriceDisplay">₪1000</span>
                        </div>
                    </div>
                </div>
                
                <div class="filter-group">
                    <label class="filter-label">מיון לפי:</label>
                    <select id="sortSelect" class="sort-select">
                        <option value="default">ברירת מחדל</option>
                        <option value="name-asc">שם (א-ת)</option>
                        <option value="name-desc">שם (ת-א)</option>
                        <option value="price-asc">מחיר (נמוך לגבוה)</option>
                        <option value="price-desc">מחיר (גבוה לנמוך)</option>
                    </select>
                </div>
                
                <div class="filter-group" style="flex: 0;">
                    <label class="filter-label">&nbsp;</label>
                    <button id="resetBtn" class="reset-btn">אפס פילטרים</button>
                </div>
            </div>
        </div>
        
        <div id="product-list" class="row">
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRcIf9Ew8DK7FY7Bpys2hDumQBd0qXrtcNjxYmYuL6yLWrfb0r4l3tX1XcmytUksxl4ZqYZO0LfC3SE/pub?gid=725361923&single=true&output=csv'; 
    
    const HEADERS = [
        "PRODUCT_URL", 
        "TITLE", 
        "DESCRIPTION", 
        "PRICE", 
        "IMAGE_URL", 
        "AFFILIATE_LINK" 
    ];

    let allProducts = [];
    let filteredProducts = [];

    function parseCSV(csvText, headers) {
        const products = [];
        const lines = csvText.trim().split('\n');
        
        for (let i = 1; i < lines.length; i++) {
            const values = lines[i].match(/(?:"[^"]*"|[^,])+/g); 
            
            if (values && values.length >= headers.length) {
                let product = {};
                headers.forEach((header, index) => {
                    let value = values[index] ? values[index].trim() : '';
                    if (value.startsWith('"') && value.endsWith('"')) {
                        value = value.slice(1, -1);
                    }
                    product[header] = value;
                });
                products.push(product);
            }
        }
        return products;
    }

    function extractPrice(priceStr) {
        if (!priceStr) return 0;
        const numStr = priceStr.toString().replace(/[^\d.]/g, '');
        return parseFloat(numStr) || 0;
    }

    function applyFilters() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const minPrice = parseFloat(document.getElementById('minPrice').value);
        const maxPrice = parseFloat(document.getElementById('maxPrice').value);
        const sortBy = document.getElementById('sortSelect').value;

        // פילטור
        filteredProducts = allProducts.filter(product => {
            const title = (product['TITLE'] || '').toLowerCase();
            const description = (product['DESCRIPTION'] || '').toLowerCase();
            const priceStr = (product['PRICE'] || '').toString();
            const price = extractPrice(priceStr);

            // חיפוש טקסט
            const matchesSearch = !searchTerm || 
                title.includes(searchTerm) || 
                description.includes(searchTerm) ||
                priceStr.includes(searchTerm);

            // טווח מחירים
            const matchesPrice = price >= minPrice && price <= maxPrice;

            return matchesSearch && matchesPrice;
        });

        // מיון
        if (sortBy === 'name-asc') {
            filteredProducts.sort((a, b) => (a['TITLE'] || '').localeCompare(b['TITLE'] || '', 'he'));
        } else if (sortBy === 'name-desc') {
            filteredProducts.sort((a, b) => (b['TITLE'] || '').localeCompare(a['TITLE'] || '', 'he'));
        } else if (sortBy === 'price-asc') {
            filteredProducts.sort((a, b) => extractPrice(a['PRICE']) - extractPrice(b['PRICE']));
        } else if (sortBy === 'price-desc') {
            filteredProducts.sort((a, b) => extractPrice(b['PRICE']) - extractPrice(a['PRICE']));
        }

        displayProducts();
    }

    function displayProducts() {
        const productList = document.getElementById('product-list');
        productList.innerHTML = '';

        if (filteredProducts.length === 0) {
            productList.innerHTML = `<div class="alert alert-info" role="alert" dir="rtl">לא נמצאו מוצרים התואמים לחיפוש.</div>`;
            return;
        }

        filteredProducts.forEach(product => {
            const affiliateLink = product['AFFILIATE_LINK'];
            const regularLink = product['PRODUCT_URL'];
            const finalLink = affiliateLink && affiliateLink.length > 5 ? affiliateLink : regularLink;
            
            const title = product['TITLE'];
            const description = product['DESCRIPTION'];
            let price = product['PRICE'];
            let imageUrl = product['IMAGE_URL'];
            
            if (imageUrl) {
                imageUrl = imageUrl.toString().replace('.avif', ''); 
                if (imageUrl.includes('<') || imageUrl.includes('>')) {
                    imageUrl = ''; 
                }
            }

            if (finalLink && title && (imageUrl || price)) { 
                if (price && price.toString().trim() !== '') {
                    price = price.toString().replace('$', '').replace('₪', '').replace(/[\(\)]/g, '').trim();
                    price = `₪${price}`; 
                } else {
                    price = "₪XX.XX (עדכן)";
                }
                
                const imageOnError = "this.onerror=null; this.src='https://placehold.co/250x250?text=No+Image'";

                const cardHtml = `
                    <div class="col-md-4 col-sm-6">
                        <div class="product-card">
                            <a href="${finalLink}" target="_blank" rel="nofollow noopener noreferrer" style="text-decoration: none; color: inherit;">
                                <div class="product-image">
                                    <img src="${imageUrl}" alt="${title} - תמונה" onerror="${imageOnError}">
                                </div>
                            </a>
                            <div class="card-body">
                                <h5 class="card-title">${title}</h5>
                                <p class="card-text">${description || 'אין תיאור.'}</p>
                                <div class="product-price">${price}</div>
                                <a href="${finalLink}" target="_blank" rel="nofollow noopener noreferrer" class="btn btn-primary btn-buy">קנה עכשיו בעלי אקספרס</a>
                            </div>
                        </div>
                    </div>
                `;
                productList.innerHTML += cardHtml;
            }
        });
    }

    async function loadProducts() {
        const productList = document.getElementById('product-list');
        
        if (!productList) {
            console.error("Error: Element with ID 'product-list' not found.");
            return;
        }

        productList.innerHTML = 'טוען מוצרים...';

        try {
            const response = await fetch(SHEET_URL);
            const csvText = await response.text();
            
            allProducts = parseCSV(csvText, HEADERS);
            filteredProducts = [...allProducts];
            
            displayProducts();
            
        } catch (error) {
            productList.innerHTML = `<div class="alert alert-danger" role="alert" dir="rtl">
                                        שגיאה בטעינת הנתונים מה-CSV. ודא שהקישור נכון.
                                        <br>פרטי שגיאה: ${error.message}
                                    </div>`;
            console.error('Error loading products:', error);
        }
    }

    // עדכון תצוגת טווח מחירים
    function updatePriceDisplay() {
        const minPrice = document.getElementById('minPrice').value;
        const maxPrice = document.getElementById('maxPrice').value;
        document.getElementById('minPriceDisplay').textContent = `₪${minPrice}`;
        document.getElementById('maxPriceDisplay').textContent = `₪${maxPrice}`;
    }

    // אפס פילטרים
    function resetFilters() {
        document.getElementById('searchInput').value = '';
        document.getElementById('minPrice').value = 0;
        document.getElementById('maxPrice').value = 1000;
        document.getElementById('sortSelect').value = 'default';
        updatePriceDisplay();
        applyFilters();
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadProducts();

        // מאזינים לפילטרים
        document.getElementById('searchInput').addEventListener('input', applyFilters);
        document.getElementById('minPrice').addEventListener('input', () => {
            updatePriceDisplay();
            applyFilters();
        });
        document.getElementById('maxPrice').addEventListener('input', () => {
            updatePriceDisplay();
            applyFilters();
        });
        document.getElementById('sortSelect').addEventListener('change', applyFilters);
        document.getElementById('resetBtn').addEventListener('click', resetFilters);
    });
</script>
</body>
</html>
