<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-SOLUTIONS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* --- סגנונות כלליים למצב כהה --- */
        body {
            background-color: #000000;
            color: #ffffff;
        }
        .product-card {
            border: 1px solid #333333;
            background-color: #1a1a1a;
            box-shadow: 0 4px 8px rgba(255, 255, 255, 0.1);
            transition: transform 0.2s;
            margin-bottom: 20px;
            height: 100%;
            display: flex;
            flex-direction: column;
            text-align: right;
            border-radius: 10px; /* עיגול פינות לכרטיס כולו */
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 16px rgba(255, 255, 255, 0.3);
        }
        .card-title {
            color: #f8f9fa;
            font-size: 1.25rem;
            font-weight: 600;
            height: 50px;
            overflow: hidden;
        }
        .card-text {
            height: 70px;
            overflow: hidden;
            font-size: 0.9rem;
            color: #aaaaaa;
            line-height: 1.5; /* רווח שורה מוגדל */
        }
        .product-price {
            font-size: 1.5rem;
            font-weight: bold;
            color: #4dc2ff;
            margin-bottom: 10px;
            /* שומר על יישור שמאלי למטבע ומחיר */
            direction: ltr; 
        }
        
        /* --- סגנונות לוגו עליון (ב-Navbar) --- */
        .navbar-brand-logo {
            height: 40px; /* גובה הלוגו ב-Navbar */
            margin-left: 10px;
        }
        .navbar-dark .navbar-brand {
            color: #ffffff;
            font-weight: bold;
        }
        /* ✅ הסרת סגנונות הלוגו הגדול הישן */
        .logo-container, .main-logo, .main-header { 
            display: none; 
        }
        
        /* --- סגנונות תמונה (מוצר) --- */
        .product-image {
            height: 250px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .product-image a {
            display: block;
            height: 100%;
            width: 100%;
        }
        .product-image img {
            width: 100%;
            height: 100%;
            /* מציג את כל התמונה ללא חיתוך */
            object-fit: contain; 
            padding: 10px; 
            background-color: #2a2a2a;
        }
        .card-body {
            flex-grow: 1;
            padding: 15px;
        }
        .btn-buy {
            width: 100%;
            font-size: 1.1rem;
            background-color: #ff471a;
            border-color: #ff471a;
        }
        .btn-buy:hover {
            background-color: #e03c15;
            border-color: #e03c15;
        }
        .alert-danger {
            background-color: #330000;
            color: #ffaaaa;
            border-color: #800000;
        }

        /* --- הצגת 4 כרטיסים בשורה ברזולוציות רחבות (מ-768px ומעלה) --- */
        @media (min-width: 768px) {
            .col-md-4 {
                /* 100% / 4 = 25% */
                flex: 0 0 auto;
                width: 25%;
                margin-top: 20px;
            }
        }

        /* --- הקטנת רוחב ומרכוז בסלולר (עד 575.98px) --- */
        @media (max-width: 575.98px) {
            .col-sm-6 {
                flex: 0 0 auto;
                width: 85%; 
                margin-left: auto;
                margin-right: auto;
                margin-top: 20px;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="img/MSolutions.png" alt="M-SOLUTIONS Logo" class="navbar-brand-logo">
                M-SOLUTIONS
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto"> 
                    
                    <li class="nav-item" style="direction: ltr;">
                        <a class="nav-link" href="#"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
                            <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
                          </svg></a>
                    </li>
                    <li class="nav-item" style="direction: ltr;">
                        <a class="nav-link" href="#"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-bag" viewBox="0 0 16 16">
                            <path d="M8 1a2.5 2.5 0 0 1 2.5 2.5V4h-5v-.5A2.5 2.5 0 0 1 8 1zm3.5 3v-.5a3.5 3.5 0 1 0-7 0V4H1v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V4h-3.5zM2 5h12v9a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5z"/>
                          </svg></a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4"> 
        <div id="product-list" class="row">
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRcIf9Ew8DK7FY7Bpys2hDumQBd0qXrtcNjxYmYuL6yLWrfb0r4l3tX1XcmytUksxl4ZqYZO0LfC3SE/pub?gid=725361923&single=true&output=csv'; 
    
    const HEADERS = [
        "PRODUCT_URL", 
        "TITLE", 
        "DESCRIPTION", 
        "PRICE", 
        "IMAGE_URL", 
        "AFFILIATE_LINK" 
    ];

    function parseCSV(csvText, headers) {
        const products = [];
        const lines = csvText.trim().split('\n');
        
        for (let i = 1; i < lines.length; i++) {
            const values = lines[i].match(/(?:"[^"]*"|[^,])+/g); 
            
            if (values && values.length >= headers.length) {
                let product = {};
                headers.forEach((header, index) => {
                    let value = values[index] ? values[index].trim() : '';
                    if (value.startsWith('"') && value.endsWith('"')) {
                        value = value.slice(1, -1);
                    }
                    product[header] = value;
                });
                products.push(product);
            }
        }
        return products;
    }


    async function loadProducts() {
        const productList = document.getElementById('product-list');
        
        if (!productList) {
            console.error("Error: Element with ID 'product-list' not found.");
            return;
        }

        productList.innerHTML = 'טוען מוצרים...';

        try {
            const response = await fetch(SHEET_URL);
            const csvText = await response.text();
            
            const products = parseCSV(csvText, HEADERS);
            
            productList.innerHTML = ''; 
            
            if (products.length === 0) {
                 productList.innerHTML = `<div class="alert alert-info" role="alert" dir="rtl">לא נמצאו מוצרים להצגה.</div>`;
                 return;
            }

            products.forEach(product => {
                
                const affiliateLink = product['AFFILIATE_LINK'];
                const regularLink = product['PRODUCT_URL'];

                const finalLink = affiliateLink && affiliateLink.length > 5 ? affiliateLink : regularLink;
                
                const title = product['TITLE'];
                const description = product['DESCRIPTION'];
                let price = product['PRICE'];
                
                let imageUrl = product['IMAGE_URL'];
                
                if (imageUrl) {
                    // הסרת סיומת AVIF ובדיקות תקינות
                    imageUrl = imageUrl.toString().replace('.avif', ''); 
                    if (imageUrl.includes('<') || imageUrl.includes('>')) {
                        imageUrl = ''; 
                    }
                }


                if (finalLink && title && (imageUrl || price)) { 
                    
                    // ✅ תיקון המטבע: הוספת סימן השקל (₪)
                    if (price && price.toString().trim() !== '') {
                        price = price.toString().replace('$', '').replace('₪', '').replace(/[\(\)]/g, '').trim();
                        price = `₪${price}`; 
                    } else {
                        price = "₪XX.XX (עדכן)";
                    }
                    
                    // שימוש ב-placehold.co במקרה של תמונה חסרה
                    const imageOnError = "this.onerror=null; this.src='https://placehold.co/250x250?text=No+Image'";

                    const cardHtml = `
                        <div class="col-md-4 col-sm-6">
                            <div class="product-card">
                                
                                <a href="${finalLink}" target="_blank" rel="nofollow noopener noreferrer" style="text-decoration: none; color: inherit;">
                                    <div class="product-image">
                                        <img src="${imageUrl}" alt="${title} - תמונה" onerror="${imageOnError}">
                                    </div>
                                </a>

                                <div class="card-body">
                                    <h5 class="card-title">${title}</h5>
                                    <p class="card-text">${description || 'אין תיאור.'}</p>
                                    <div class="product-price">${price}</div>
                                    
                                    <a href="${finalLink}" target="_blank" rel="nofollow noopener noreferrer" class="btn btn-primary btn-buy">קנה עכשיו בעלי אקספרס</a>
                                </div>
                            </div>
                        </div>
                    `;
                    productList.innerHTML += cardHtml;
                }
            });
            
        } catch (error) {
            productList.innerHTML = `<div class="alert alert-danger" role="alert" dir="rtl">
                                        שגיאה בטעינת הנתונים מה-CSV. ודא שהקישור נכון.
                                        <br>פרטי שגיאה: ${error.message}
                                    </div>`;
            console.error('Error loading products:', error);
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadProducts();
    });
</script>
</body>
</html>
