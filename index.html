<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-SOLUTIONS | מוצרים מומלצים</title>
    
    <link rel="icon" type="image/png" href="img/logo.png">
    <link rel="apple-touch-icon" href="img/logo.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Phone Frame Wrapper */
        .phone-frame {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            position: relative;
        }

        .container {
            max-width: 100%;
            margin: 0;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }

        /* Share Button */
        .share-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 50px;
            height: 50px;
            background: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .share-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
            background: #667eea;
        }

        .share-btn:hover svg {
            fill: white;
        }

        .share-btn svg {
            width: 22px;
            height: 22px;
            fill: #4a5568;
            transition: all 0.3s ease;
        }

        /* QR Code Section */
        .qr-code-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: white;
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            z-index: 1000;
            transition: all 0.3s ease;
        }

        .qr-code-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
        }

        .qr-code-container img {
            width: 120px;
            height: 120px;
            display: block;
            margin-bottom: 8px;
            border-radius: 10px;
        }

        .qr-code-container .qr-label {
            font-size: 0.75rem;
            color: #4a5568;
            font-weight: 600;
            margin-top: 5px;
        }

        /* Hide QR on mobile */
        @media (max-width: 768px) {
            .qr-code-container {
                display: none;
            }
        }

        /* Header */
        header {
            text-align: center;
            padding: 40px 20px;
        }

        .logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 20px;
            background: white;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1rem;
            color: #4a5568;
            font-weight: 400;
            margin-bottom: 30px;
        }

        /* Search Bar */
        .search-input {
            width: 100%;
            padding: 16px 20px;
            border: none;
            border-radius: 25px;
            background: white;
            font-size: 1rem;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
            text-align: center;
            margin-bottom: 30px;
        }

        .search-input:focus {
            outline: none;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.2);
        }

        /* Back Button */
        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: white;
            border: none;
            border-radius: 25px;
            color: #4a5568;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 30px;
            font-family: 'DM Sans', sans-serif;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .back-btn:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.3);
        }

        /* Category Card - SIMPLE LAYOUT */
        .category-card {
            display: block;
            position: relative;
            background: white;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .category-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
        }

        /* Images Grid */
        .category-images {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 10px;
            height: 250px;
            margin-bottom: 35px;
            overflow: hidden;
        }

        .category-images img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 12px;
            background: #f5f5f5;
        }

        .category-image-large {
            grid-row: 1 / 3;
            grid-column: 1;
        }

        /* Text Below Images */
        .category-info {
            display: block;
            position: relative;
            width: 100%;
            text-align: center;
            padding: 10px 0 0 0;
            margin-top: 0;
            clear: both;
            float: none;
        }

        .category-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 5px;
        }

        .category-count {
            font-size: 0.9rem;
            color: #999;
        }

        /* Products Grid - 3 per row */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .product-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .product-image {
            width: 100%;
            height: 250px;
            overflow: hidden;
            background: #f5f5f5;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .product-card:hover .product-image img {
            transform: scale(1.05);
        }

        .product-info {
            padding: 15px;
            text-align: center;
        }

        .product-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #1a202c;
            margin-bottom: 8px;
            line-height: 1.4;
            height: 42px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .product-description {
            font-size: 0.85rem;
            color: #718096;
            line-height: 1.3;
            height: 36px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        /* Load More Button */
        .load-more-btn {
            display: block;
            margin: 30px auto;
            padding: 16px 32px;
            background: white;
            border: none;
            border-radius: 25px;
            color: #1a202c;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'DM Sans', sans-serif;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .load-more-btn:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.3);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 40px 20px;
            color: #718096;
            font-size: 0.9rem;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #718096;
            font-size: 1.1rem;
        }

        .hidden {
            display: none !important;
        }

        /* Responsive */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .phone-frame {
                border-radius: 20px;
            }

            .share-btn {
                top: 15px;
                right: 15px;
                width: 45px;
                height: 45px;
            }

            .category-images {
                height: 200px;
                gap: 8px;
                margin-bottom: 30px;
                overflow: hidden;
            }

            .products-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }

            .product-image {
                height: 180px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 0;
                align-items: flex-start;
            }

            .phone-frame {
                border-radius: 0;
                max-width: 100%;
                box-shadow: none;
            }

            .category-images {
                height: 180px;
                gap: 6px;
                margin-bottom: 25px;
                overflow: hidden;
            }

            .products-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .product-image {
                height: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <!-- Share Button -->
        <button class="share-btn" onclick="shareWebsite()" title="שתף את האתר">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/>
            </svg>
        </button>
        
        <div class="container">
            <!-- Header -->
            <header>
                <div class="logo">
                    <img src="img/logo.png" alt="M-SOLUTIONS Logo" onerror="this.style.display='none'">
                </div>
                <h1>M-SOLUTIONS</h1>
                <p class="subtitle">בחר קטגוריה לצפייה במוצרים 🛍️</p>
            </header>

        <!-- Categories View -->
        <div id="categoriesView">
            <input type="text" id="categorySearch" class="search-input" placeholder="🔍 חפש קטגוריה...">
            <div id="categoriesList">
                <div class="loading">טוען קטגוריות...</div>
            </div>
        </div>

        <!-- Products View -->
        <div id="productsView" class="hidden">
            <button class="back-btn" onclick="showCategories()">← חזרה לקטגוריות</button>
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 חפש מוצר...">
            <div id="productsList" class="products-grid">
                <div class="loading">טוען מוצרים...</div>
            </div>
            <button class="load-more-btn hidden" id="loadMoreBtn" onclick="loadMoreProducts()">טען עוד מוצרים</button>
        </div>

        <!-- Footer -->
        <footer>
            <p>© 2026 M-SOLUTIONS | מוצרים מומלצים מ-AliExpress</p>
        </footer>
        </div>
    </div>

    <!-- QR Code for Mobile View -->
    <div class="qr-code-container">
        <img id="qrCodeImage" src="" alt="QR Code">
        <div class="qr-label">View on mobile</div>
    </div>

    <script>
        // Generate QR code with actual page URL
        const currentURL = window.location.href;
        document.getElementById('qrCodeImage').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(currentURL)}`;
    </script>
    
    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRcIf9Ew8DK7FY7Bpys2hDumQBd0qXrtcNjxYmYuL6yLWrfb0r4l3tX1XcmytUksxl4ZqYZO0LfC3SE/pub?gid=725361923&single=true&output=csv';
        
        const HEADERS = ["PRODUCT_URL", "TITLE", "DESCRIPTION", "IMAGE_URL", "AFFILIATE_LINK", "KEYWORDS", "CATEGORY"];
        const CATEGORIES = [
            { name: 'מוצרי חשמל', icon: '🔌' },
            { name: 'מטבח ובית', icon: '🍳' },
            { name: 'ספורט וכושר', icon: '⚽' },
            { name: 'תיקים ואביזרים', icon: '👜' },
            { name: 'כלי עבודה', icon: '🔧' },
            { name: 'צעצועים', icon: '🎮' },
            { name: 'אופנה', icon: '👔' },
            { name: 'מוצרים לטלפון', icon: '📱' }
        ];

        let allProducts = [];
        let filteredProducts = [];
        let displayedCount = 0;
        let currentCategory = '';
        const PRODUCTS_PER_LOAD = 12;

        function parseCSV(csvText, headers) {
            const products = [];
            const lines = csvText.trim().split('\n');
            
            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].match(/(?:"[^"]*"|[^,])+/g); 
                if (values && values.length >= headers.length) {
                    let product = {};
                    headers.forEach((header, index) => {
                        let value = values[index] ? values[index].trim() : '';
                        if (value.startsWith('"') && value.endsWith('"')) {
                            value = value.slice(1, -1);
                        }
                        product[header] = value;
                    });
                    products.push(product);
                }
            }
            return products;
        }

        function getCategoryImages(category) {
            const categoryProducts = allProducts.filter(p => p['CATEGORY'] === category);
            const images = [];
            
            for (let i = 0; i < Math.min(5, categoryProducts.length); i++) {
                let imageUrl = categoryProducts[i]['IMAGE_URL'];
                if (imageUrl) {
                    imageUrl = imageUrl.toString().replace('.avif', '');
                    if (!imageUrl.includes('<') && !imageUrl.includes('>')) {
                        images.push(imageUrl);
                    }
                }
            }
            
            while (images.length < 5) {
                images.push('https://via.placeholder.com/300x300/f5f5f5/999?text=📦');
            }
            
            return images;
        }

        function displayCategories() {
            const container = document.getElementById('categoriesList');
            container.innerHTML = '';

            CATEGORIES.forEach(category => {
                const count = allProducts.filter(p => p['CATEGORY'] === category.name).length;
                const images = getCategoryImages(category.name);
                
                const card = document.createElement('div');
                card.className = 'category-card';
                card.onclick = () => showProducts(category.name);
                
                card.innerHTML = `
                    <div class="category-images">
                        <img class="category-image-large" src="${images[0]}" alt="${category.name}"
                             onerror="this.src='https://via.placeholder.com/300x300/f5f5f5/999?text=📦'">
                        <img src="${images[1]}" alt="${category.name}"
                             onerror="this.src='https://via.placeholder.com/300x300/f5f5f5/999?text=📦'">
                        <img src="${images[2]}" alt="${category.name}"
                             onerror="this.src='https://via.placeholder.com/300x300/f5f5f5/999?text=📦'">
                        <img src="${images[3]}" alt="${category.name}"
                             onerror="this.src='https://via.placeholder.com/300x300/f5f5f5/999?text=📦'">
                        <img src="${images[4]}" alt="${category.name}"
                             onerror="this.src='https://via.placeholder.com/300x300/f5f5f5/999?text=📦'">
                    </div>
                    <div class="category-info">
                        <div class="category-name">${category.name}</div>
                        <div class="category-count">${count} products</div>
                    </div>
                `;
                
                container.appendChild(card);
            });
        }

        function showCategories() {
            document.getElementById('categoriesView').classList.remove('hidden');
            document.getElementById('productsView').classList.add('hidden');
            document.querySelector('.subtitle').textContent = 'בחר קטגוריה לצפייה במוצרים 🛍️';
            currentCategory = '';
        }

        function showProducts(category) {
            currentCategory = category;
            document.getElementById('categoriesView').classList.add('hidden');
            document.getElementById('productsView').classList.remove('hidden');
            document.querySelector('.subtitle').textContent = `${category} 🛍️`;
            applyFilters();
        }

        function applyFilters() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            filteredProducts = allProducts.filter(product => {
                const title = (product['TITLE'] || '').toLowerCase();
                const description = (product['DESCRIPTION'] || '').toLowerCase();
                const category = product['CATEGORY'] || '';
                const matchesSearch = !searchTerm || title.includes(searchTerm) || description.includes(searchTerm);
                const matchesCategory = category === currentCategory;
                return matchesSearch && matchesCategory;
            });
            displayProducts();
        }

        function displayProducts(append = false) {
            const productList = document.getElementById('productsList');
            const loadMoreBtn = document.getElementById('loadMoreBtn');
            
            if (!append) {
                productList.innerHTML = '';
                displayedCount = 0;
            }

            if (filteredProducts.length === 0) {
                productList.innerHTML = '<div class="loading">לא נמצאו מוצרים בקטגוריה זו 😔</div>';
                loadMoreBtn.classList.add('hidden');
                return;
            }

            const endIndex = Math.min(displayedCount + PRODUCTS_PER_LOAD, filteredProducts.length);
            const productsToShow = filteredProducts.slice(displayedCount, endIndex);

            productsToShow.forEach(product => {
                const affiliateLink = product['AFFILIATE_LINK'];
                const regularLink = product['PRODUCT_URL'];
                const finalLink = affiliateLink && affiliateLink.length > 5 ? affiliateLink : regularLink;
                
                const title = product['TITLE'];
                const description = product['DESCRIPTION'];
                let imageUrl = product['IMAGE_URL'];
                
                if (imageUrl) {
                    imageUrl = imageUrl.toString().replace('.avif', ''); 
                    if (imageUrl.includes('<') || imageUrl.includes('>')) {
                        imageUrl = ''; 
                    }
                }

                if (finalLink && title && imageUrl) {
                    const card = document.createElement('a');
                    card.href = finalLink;
                    card.target = '_blank';
                    card.rel = 'nofollow noopener noreferrer';
                    card.className = 'product-card';
                    
                    card.innerHTML = `
                        <div class="product-image">
                            <img src="${imageUrl}" alt="${title}"
                                 onerror="if(!this.dataset.tried){this.dataset.tried='1';this.src='https://images.weserv.nl/?url='+encodeURIComponent('${imageUrl}');}else{this.src='https://via.placeholder.com/300x300/f5f5f5/999?text=📦';}">
                        </div>
                        <div class="product-info">
                            <div class="product-title">${title}</div>
                            <div class="product-description">${description || 'לחץ לפרטים נוספים'}</div>
                        </div>
                    `;
                    
                    productList.appendChild(card);
                }
            });
            
            displayedCount = endIndex;
            
            if (displayedCount >= filteredProducts.length) {
                loadMoreBtn.classList.add('hidden');
            } else {
                loadMoreBtn.classList.remove('hidden');
                loadMoreBtn.textContent = `טען עוד (${filteredProducts.length - displayedCount} מוצרים נותרו)`;
            }
        }

        function loadMoreProducts() {
            displayProducts(true);
        }

        async function loadProducts() {
            try {
                const response = await fetch(SHEET_URL);
                const csvText = await response.text();
                allProducts = parseCSV(csvText, HEADERS);
                allProducts.reverse();
                displayCategories();
            } catch (error) {
                document.getElementById('categoriesList').innerHTML = '<div class="loading">שגיאה בטעינת המוצרים 😞</div>';
                console.error('Error:', error);
            }
        }

        async function shareWebsite() {
            const shareData = {
                title: 'M-SOLUTIONS | מוצרים מומלצים',
                text: 'בואו לראות את המוצרים המומלצים שלנו מ-AliExpress! 🛍️',
                url: window.location.href
            };

            try {
                if (navigator.share) {
                    await navigator.share(shareData);
                } else {
                    await navigator.clipboard.writeText(window.location.href);
                    alert('הקישור הועתק! 📋\nכעת תוכל להדביק אותו בכל מקום 😊');
                }
            } catch (err) {
                if (err.name !== 'AbortError') {
                    try {
                        await navigator.clipboard.writeText(window.location.href);
                        alert('הקישור הועתק! 📋');
                    } catch (clipErr) {
                        alert('לא ניתן לשתף כרגע 😔');
                    }
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadProducts();
            document.getElementById('searchInput').addEventListener('input', applyFilters);
            document.getElementById('categorySearch').addEventListener('input', function() {
                const searchTerm = this.value.toLowerCase();
                const categoryCards = document.querySelectorAll('.category-card');
                categoryCards.forEach(card => {
                    const title = card.querySelector('.category-name').textContent.toLowerCase();
                    if (title.includes(searchTerm) || searchTerm === '') {
                        card.style.display = 'block';
                    } else {
                        card.style.display = 'none';
                    }
                });
            });
        });
    </script>
</body>
</html>
