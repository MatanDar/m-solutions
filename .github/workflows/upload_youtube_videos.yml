name: Upload YouTube Videos Daily

on:
  schedule:
    # 3 פעמים ביום: 09:00, 14:00, 19:00 (זמן ישראל = UTC+2)
    - cron: '0 7 * * *'   # 09:00 ישראל
    - cron: '0 12 * * *'  # 14:00 ישראל
    - cron: '0 17 * * *'  # 19:00 ישראל
  
  workflow_dispatch:  # ✅ כפתור להרצה ידנית!

jobs:
  create-and-upload-video:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-auth google-auth-oauthlib google-auth-httplib2
        pip install google-api-python-client requests
    
    - name: Create video and upload to YouTube
      env:
        GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
        GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        YOUTUBE_CREDENTIALS: ${{ secrets.YOUTUBE_CREDENTIALS }}
      run: |
        python create_video_and_upload.py
    
    - name: Log completion
      run: |
        echo "✅ Video uploaded successfully at $(date)"