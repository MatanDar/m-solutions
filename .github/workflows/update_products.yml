name: Update Products from AliExpress

on:
  schedule:
    - cron: '0 10 * * 0'
    - cron: '0 10 * * 3'
    - cron: '0 10 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-products:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run AliExpress to Google Sheets script
        env:
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: |
          echo "🎯 מושך 30 Best Deals מ-AliExpress..."
          python update_aliexpress_to_sheets.py
      
      - name: Summary
        if: success()
        run: |
          echo "✅ המוצרים עודכנו בהצלחה!"
      
      - name: Error notification
        if: failure()
        run: |
          echo "❌ משהו השתבש בעדכון המוצרים"
